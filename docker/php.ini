; NouriLoop self-hosted image (loaded after php.ini-production).
expose_php = Off
; Health-data imports and image handling need headroom (production uses 512M too).
memory_limit = 512M
; A meal takes up to three phone photos; a recipe up to five.
upload_max_filesize = 32M
post_max_size = 100M
max_file_uploads = 10
; The app stores user wall-clock times and does its own per-user timezone math;
; the server zone only frames scheduling instants, consistently, whatever it is.
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
