# Dependabot: turns the repo's (already-enabled) security alerts into actual
# update PRs, which the existing CI (unit + Panther e2e) then validates.
# Routine version bumps are grouped into one weekly PR to keep noise down;
# security fixes always arrive as their own individual PRs, ungrouped.
#
# target-branch: dev (2026-09-18) -- version-update PRs go to the integration
# branch, not around it into main (dev -> main is John's merge). Dependabot
# reads this file from the DEFAULT branch, so the setting only takes effect
# once it reaches main; security-update PRs always target main regardless.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
