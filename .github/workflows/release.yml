name: Release

# On a version tag, attach a source tarball (+ SHA-256) to the GitHub release, for
# self-hosters who don't use git (docs/self-hosting.md). `git archive` honours the
# export-ignore list in .gitattributes, so private operations files stay out.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build tarball
        id: build
        run: |
          tag="${GITHUB_REF_NAME}"
          name="nouriloop-app-${tag}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "${tag}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber
