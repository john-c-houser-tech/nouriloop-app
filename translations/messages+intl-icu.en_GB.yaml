trends:
    arrows_legend: >-
        The arrows show the <strong>direction over the last {days,
        plural, one {# day} other {# days}}</strong> — not today on its own: <span
        class="text-nowrap"><i class="bi bi-arrow-up-right"></i>
        rising</span>, <span class="text-nowrap"><i class="bi
        bi-arrow-down-right"></i> falling</span>, <span
        class="text-nowrap"><i class="bi bi-arrow-right"></i> holding
        steady</span>. Whether a change is good or bad is shown by the tile's
        colour (<span class="text-success fw-semibold">green</span> good ·
        <span class="text-warning fw-semibold">amber</span> watch · <span
        class="text-danger fw-semibold">red</span> attention).
    inflammation:
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> a daily −10 (anti-)
            to +10 (pro-inflammatory) estimate of your logged food — an
            educational wellness signal, not medical advice.</p> <p
            class="mb-1"><strong>Data source:</strong> each day's logged meals
            — their analysed nutrition and ingredient list.</p> <p
            class="mb-1"><strong>How it's calculated:</strong> a pure
            heuristic (no AI) blends a nutrient backbone (saturated fat,
            sugar, sodium push pro; fibre + antioxidant micros A/C/D/E, B6,
            folate, B12, Mg, Zn, Se as %RDA push anti — directionality per the
            Dietary Inflammatory Index) with food-keyword adjustments
            (processed meat / fried / sugary → pro; fatty fish, olive oil,
            leafy greens, berries, turmeric → anti, capped per meal), summed
            per local day and clamped to −10…+10.</p>
    symptom:
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> {label}'s daily level
            (0–10) stacked above the other factors you track, each in its own
            units. The <em>Diet</em> stack covers protein, carbs, fat, fibre
            and your dietary inflammation score; the <em>Health</em> stack
            covers steps, blood glucose, weight and nightly sleep (shown only
            if you've imported those metrics).</p> <p
            class="mb-1"><strong>Why stacked instead of overlaid:</strong>
            these factors use very different units (grams vs mg/dL vs steps),
            so overlaying them on one axis either hides the real numbers or
            buries the shape in clutter. Stacking keeps each factor's true
            scale while lining every panel up on the same date axis — hover
            any point for its exact value.</p> <p
            class="mb-1"><strong>Significant correlations:</strong> for every
            factor we compute a Pearson <em>r</em> both same-day and next-day
            (effects can lag), and a two-tailed significance test. Only
            correlations with at least {minDays, plural, one {# matched day}
            other {# matched days}} and p &lt; 0.05 are listed — descriptive, not causal, and clearer the more you
            log.</p>
    sleep:
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> nightly total sleep
            hours, an optional dinner→sleep gap line, and evening glucose
            dots.</p> <p class="mb-1"><strong>Data source:</strong> imported
            sleep-stage data (Core/Deep/REM/inBed), meal timestamps, and
            glucose readings.</p> <p class="mb-1"><strong>How it's
            calculated:</strong> total hours = sum of a night's sleep stages;
            gap = hours from dinner to sleep onset; evening glucose dot =
            peak {unit} from 6–10 PM. The table below pairs each night's
            dinner, evening glucose (peak 6–10 PM), gap, overnight glucose
            (average midnight–6 AM) and sleep, colour-coded by fixed
            thresholds.</p>
        table_legend: >-
            Evening glucose = peak {unit} from 6–10 PM. Overnight glucose =
            avg {unit} from midnight–6 AM. Colour coding: <span class="badge
            bg-success">good</span> <span class="badge bg-warning
            text-dark">watch</span> <span class="badge bg-danger">high</span>
    health:
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> imported body
            measurements over time, with a daily range band. Tap a metric
            button to add/remove its line.</p> <p class="mb-1"><strong>Data
            source:</strong> readings imported via Apple Health, Health Auto
            Export, or the ingestion API.</p> <p class="mb-1"><strong>How
            it's calculated:</strong> per local day the line = daily average
            and the shaded band = daily min–max; no transform beyond unit
            normalisation (e.g. lb→kg). The good / watch / attention badge on
            each metric's overview tile flags its latest reading against
            simple, non-medical thresholds.</p>
    calories:
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> total calories
            logged per day.</p> <p class="mb-1"><strong>Data source:</strong>
            your logged meals' analysed calories.</p> <p
            class="mb-1"><strong>How it's calculated:</strong> sum of meal
            calories per local day. The overview badge flags when the daily
            average falls below 1,200 or above 3,500 kcal.</p>
