        AI analysis} other {# AI analyses}} each month — meal photos
        or recipe imports. Favourite meals are included on every
        plan — re-logging a saved favourite never uses an analysis.
lp:
    diabetes:
        price_heading: No proprietary hardware. No $200-a-year programme.
        price_body: >-
            Apps like Nutrisense and Levels charge $200+ a year and want you
            on their sensor programme. NouriLoop Loop+ is
            <strong>${price}/year</strong> and works with the
            over-the-counter sensor you already wear.
        compare_them_sub: Proprietary sensor programmes, subscription required
        founder: >-
            <strong>Why NouriLoop exists:</strong> it was built by a
            developer in his 60s who wears the same Lingo sensor this page
            talks about — because after months of logging meals in one app
            and watching glucose in another, no tool would connect the two
            without a $200-a-year hardware programme. So he built it.
        one_place_items: >-
            <li><strong>Snap a photo of your meal.</strong> The nutrition — carbs,
            sugar, fibre, protein, and more — is estimated from the image. No database
            searching.</li> <li><strong>Your CGM readings arrive automatically.</strong>
            On iPhone, a scheduled export from Apple Health does it — a guided setup
            walks you through it once. On Android, you can import your readings from a
            compatible file today, and we're working on making it automatic.</li>
            <li><strong>Every meal gets a response curve:</strong> your baseline, your
            peak, how long it took to get there, and how long it took to come back
            down.</li> <li><strong>Meals are ranked against each other</strong> — your
            biggest spikes, your gentlest meals, and the meals that spiked you more than
            their nutrition predicted.</li> <li><strong>Import your own
            recipes.</strong> Photograph a cookbook page or a recipe card once —
            NouriLoop reads the ingredients, estimates per-serving carbs and sugar, and
            saves it as a favourite, so logging home cooking takes one tap.</li>
    fiber:
        seo_description: >-
            Track fibre, vitamins, and minerals from a photo of your meal —
            no database lookup. See which nutrients you are consistently
            missing.
        title: Track Your Fibre Intake From a Photo
        headline: >-
            Your doctor said to eat more fibre.<br>Here's how to know if you
            are.
        lead: >-
            Most apps don't track fibre at all — or hide it behind manual
            database entry, where you have to know the exact food item
            first. NouriLoop estimates fibre, vitamins, and minerals from a
            photo of your meal, and shows you whether you're actually
            hitting your target, day after day.
        cta: Track your fibre intake free
        summary_alt: >-
            A logged meal's Nutrition Summary: AI confidence, calories and
            macros, then fibre, sodium, potassium, calcium, iron, magnesium,
            zinc, and vitamins A and C
        photo_heading: Fibre from a photo — no database searching
        photo_items: >-
            <li><strong>Snap a photo of your plate.</strong> NouriLoop
            estimates fibre alongside a full nutrient panel — folate,
            magnesium, potassium, vitamins A through E, and 15+ others —
            from the image itself.</li> <li><strong>Every estimate comes
            with a confidence score</strong>, and a quick review screen lets
            you adjust ingredients or attach the nutrition-facts label for a
            sharper number. Honest estimates, not false precision.</li>
            <li><strong>Your daily dashboard shows where today stands</strong>
            — so "eat more fibre" becomes a number you can actually
            watch.</li>
            <li><strong>Cook at home? Import the recipe
            once.</strong> Photograph the cookbook page or
            recipe card, and NouriLoop reads the ingredients,
            works out fibre and the full nutrient panel per
            serving, and saves it as a favourite you can log in
            one tap.</li>
        gaps_items: >-
            <li><strong>Gap analysis over 7, 14, 30, or 90 days</strong> —
            see whether your fibre average is trending where it should.</li>
            <li><strong>Supplements counted in:</strong> scan a supplement
            label with your camera and NouriLoop folds what you already take
            into the picture, so the gaps it flags are the real ones.</li>
            <li><strong>Trends over time</strong> — charts of your intake so
            you can show yourself (and your doctor) the direction you're
            heading.</li>
    inflammation:
        score_items: >-
            <li><strong>Snap a photo of each meal</strong> — the nutrition
            is estimated from the image, in seconds. No manual database
            entry.</li> <li><strong>Every day gets a score from −10 to
            +10:</strong> saturated fat, sugar, and sodium push it toward
            pro-inflammatory; fibre, antioxidant vitamins, fatty fish, olive
            oil, leafy greens, and berries pull it the other way.</li>
            <li><strong>It's transparent, rule-based scoring</strong> built
            on published nutrition research — the same directionality as the
            Dietary Inflammatory Index — not a black box.</li>
            <li><strong>It works retroactively:</strong> a day scored last
            Tuesday is a data point, so your chart fills in as you log.</li>
        chart_alt: >-
            A Trends relationship panel stacking a symptom against protein,
            carbs, fat, fibre, and inflammation score

