            Erfassen Sie Mahlzeiten per Foto und sehen Sie Ihre echte
            CGM-Glukosereaktion über die nächsten 3 Stunden. Funktioniert
            mit Abbott Lingo und Stelo — ohne proprietäre Hardware.
        title: Sehen Sie, wie jede Mahlzeit Ihren Blutzucker beeinflusst
        headline: Sehen Sie, wie jede Mahlzeit Ihren Blutzucker beeinflusst
        lead: >-
            Fotografieren Sie Ihre Mahlzeit, und NouriLoop legt Ihre
            echten CGM-Messwerte der nächsten drei Stunden darüber — damit
            Sie endlich sehen, welche Lebensmittel Ihre Werte hochtreiben
            und welche nicht. Funktioniert mit dem Abbott-Lingo- oder
            Stelo-Sensor, den Sie bereits besitzen.
        cta: Kostenlos testen — funktioniert mit Ihrem Lingo oder Stelo
        sensor_note: >-
