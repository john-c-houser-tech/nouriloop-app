        curve_alt: >-
            Die Glukosereaktion einer Mahlzeit: die CGM-Kurve rund um die
            Mahlzeit mit Ausgangswert, Spitze, Zeit bis zur Spitze und
            einem Vergleich mit der Nährwert-Schätzung der Mahlzeit
        one_place_heading: Ihre Mahlzeiten und Ihre Glukose — endlich an einem Ort
        one_place_intro: >-
            Sie erfassen Mahlzeiten in einer App, Ihr Sensor zeichnet
            Glukose in einer anderen auf — und nichts verbindet die
            beiden. NouriLoop schon:
        one_place_items: >-
