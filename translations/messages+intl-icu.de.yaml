    gentlest: Am sanftesten für Sie
    above_expected: Stärker ausgeschlagen als die Nährwerte vermuten ließen
    above_note: >-
        Diese Mahlzeiten erhöhten Ihre Glukose stärker, als eine Schätzung
        der glykämischen Last aus ihren Kohlenhydraten, Ballaststoffen,
        ihrem Zucker, Fett und Protein nahelegen würde — es lohnt sich, auf
        Muster zu achten.
    coach: AI Pattern Coach
    coach_note: >-
        Erstellt aus Ihren eigenen Glukose-Reaktionen — ein informatives
        Wellness-Signal, keine medizinische Beratung.
    coach_unavailable: Der Coach ist gerade nicht verfügbar — bitte versuchen Sie es gleich noch einmal.
    premium: Premium
    coach_pitch: >-
        Mehr als nur Ranglisten: Eine KI-Tiefenanalyse liest Ihre
        Glukose-Reaktionen im Zusammenhang mit den Lebensmitteln, Zeiten und
        Kombinationen dahinter — und findet persönliche Muster („Reis lässt
        Ihre Werte steigen, mit Bohnen aber nicht“) sowie konkrete
        Alternativen zum Ausprobieren.
    coming_soon: Bald verfügbar
    footer: >-
