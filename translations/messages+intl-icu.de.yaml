cgm:
    title: CGM verbinden
    heading: Verbinden Sie Ihren Lingo oder Stelo
    lead: >-
        Eine einmalige Einrichtung, die Ihre Glukose-Messwerte automatisch an
        {app_name} sendet — so bekommt jede erfasste Mahlzeit ihre eigene
        Blutzucker-Reaktionskurve.
    need_heading: Was Sie brauchen
    need_items: >-
        <li>Einen <strong>Abbott Lingo</strong>- oder <strong>Dexcom
        Stelo</strong>-Sensor, der bereits Messwerte in der Apple
        <strong>Health</strong>-App auf Ihrem iPhone anzeigt.</li> <li>Ihr
        <strong>iPhone</strong> und etwa <strong>10 Minuten</strong>.</li>
        <li>Eine kleine Helfer-App namens <strong>Health Auto Export</strong>
        (Schritt 1). Sie übernimmt das Senden; ihre automatische
        Synchronisierung braucht das kleine app-eigene Abo (Basic kostet
        2,99 $, oder 6,99 $ für ein Jahr Premium).</li>
    need_note: >-
        Bevor Sie starten: Öffnen Sie die Health-App und prüfen Sie, ob dort
        aktuelle Glukose-Messwerte zu sehen sind. Hat Health keine Werte,
        kann auch {app_name} keine empfangen — prüfen Sie zuerst die App
        Ihres Sensors.
    step1_heading: „Health Auto Export“ installieren
    step1_install: >-
        Installieren Sie auf Ihrem iPhone {link}Health Auto Export –
        JSON+CSV{link_end} aus dem App Store. Sie lesen das am Computer?
        Richten Sie die iPhone-Kamera auf den QR-Code unten, um direkt
        dorthin zu springen.
    qr_alt: App-Store-QR-Code
    step1_permissions: >-
        Beim ersten Öffnen bittet die App um Erlaubnis, Ihre Health-Daten zu
        lesen. <strong>Turn On All</strong> anzutippen ist am einfachsten —
        aber Sie entscheiden: Aktivieren Sie gern nur, was {app_name} sehen
        soll. <strong>Blood Glucose</strong> (Blutzucker) ist das, was diese
        Einrichtung braucht; <strong>Gewicht, Schritte, Schlaf, Herzfrequenz
        und Blutdruck</strong> fließen ebenfalls sinnvoll in Ihre Diagramme
        und Trends ein.
    permissions_alt: Health-Zugriffsabfrage mit aktiviertem Blood Glucose
    step2_heading: Ihren {app_name}-Zugriffstoken erstellen
    step2_lead: >-
        Der Token ist wie ein Spezial-Passwort, mit dem die Helfer-App — und
        nur sie — Gesundheitsdaten an Ihr {app_name}-Konto senden darf.
    token_reveal: Ihr neuer Token — Sie fügen ihn in Schritt 3 ein
    copy: Kopieren
    copied: Kopiert
    token_once: >-
        Zu Ihrer Sicherheit wird er nur dieses eine Mal angezeigt — aber
        keine Sorge, Sie müssen ihn nicht auswendig lernen: Schritt 3 unten
        enthält ihn bereits, fertig zum Kopieren.
    token_again: >-
        Sie haben bereits einen Token, aber aus Sicherheitsgründen zeigen wir
        einen Token nur einmal an. Kein Problem — erstellen Sie einfach einen
        neuen und verwenden Sie ihn unten.
    create_token: Meinen Token erstellen
    step3_heading: Die Automation in Health Auto Export einrichten
    step3_lead: >-
        Öffnen Sie in der App Health Auto Export den Bereich
        <strong>Automations</strong> und erstellen Sie eine neue
        <strong>REST API</strong>-Automation. Tragen Sie genau diese Werte
        ein — nutzen Sie die Kopieren-Buttons und fügen Sie am Telefon ein
        (sind Sie auf beiden Geräten bei iCloud angemeldet, lässt sich hier
        Kopiertes meist dort einfügen):
    row_url: URL
    row_method: Methode
    row_format: Exportformat
    row_header_name: Header-Name
    row_header_value: Header-Wert
    bearer_hint: >-
        <code>Bearer</code> + ein Leerzeichen + Ihr Token — erledigen Sie
        zuerst {link}Schritt 2{link_end}, dann füllt sich das hier von
        selbst.
    row_data_type: Datentyp
    data_type_body: >-
        <strong>Health Metrics</strong>, und unter „Select Health Metrics“
        ist <strong>Select All</strong> am einfachsten — {app_name} stellt
        Glukose, Gewicht, Schritte, Schlaf, Herzfrequenz und Blutdruck dar
        und ignoriert alles andere einfach. Möchten Sie weniger teilen?
        Wählen Sie nur <strong>Blood Glucose</strong> (das braucht diese
        Einrichtung) plus die anderen Werte, die {app_name} sehen soll.
    row_cadence: Sync-Rhythmus
    cadence_body: >-
        Einmal am <strong>Tag</strong> genügt — die morgendliche
        Synchronisierung bringt die Kurven von gestern. Lieber Kurven vom
        selben Tag? Ein schnellerer Rhythmus (etwa stündlich) ist auch in
        Ordnung; {app_name} ignoriert Messwerte, die es schon hat.
    summarize_warning: >-
        <strong>Eine Einstellung ist wichtiger als alle anderen:</strong>
        Schalten Sie in den Export Settings <strong>Summarize Data
        aus</strong>. Ist die Option an, sendet die App Tageszusammenfassungen
        statt Ihrer tatsächlichen Messwerte — die werden zwar importiert,
        aber ein ganzer Tag schrumpft auf eine einzige Zahl, und {app_name}
        braucht die ~5-Minuten-Messwerte, um Ihre Mahlzeitenkurven zu
        zeichnen. Der Rest kann bleiben, wie er ist (Export Format
        <code>JSON</code>, Export Version v2, Date Range Default);
        <strong>Batch Requests einzuschalten</strong> ist eine gute Idee —
        das teilt einen großen ersten Export in kleinere Sendungen auf.
    hae_screen_alt: Health Auto Export — Bildschirm „{name}“
    step4_heading: Ersten Export senden
    step4_body: >-
        Speichern Sie die Automation und starten Sie sie einmal von Hand —
        öffnen Sie sie und tippen Sie auf den manuellen <strong>export /
        update</strong>-Button. (Nach diesem ersten Mal sendet die App neue
        Messwerte nach dem von Ihnen gewählten Zeitplan.)
    manual_export_alt: Health Auto Export — manueller Export
    step5_heading: Zusehen, wie die Daten eintreffen
    step5_lead: >-
        Diese Seite prüft alle paar Sekunden automatisch, ob Ihre Daten da
        sind — lassen Sie sie geöffnet, während Sie die Schritte am Telefon
        abschließen.
    noscript: (JavaScript ist in diesem Browser aus — laden Sie die Seite neu, um Updates zu sehen.)
    rung_token: Token erstellt
    rung_token_sub: Schritt 2 — Ihr Zugriffstoken existiert.
    rung_phone: Ihr Telefon hat {app_name} erreicht
    rung_phone_sub: Der Token wurde kürzlich verwendet — die Automation hat Verbindung.
    rung_arrived: Glukose-Messwerte sind da
    rung_arrived_sub: >-
        {count, plural, one {# Messwert} other {# Messwerte}} in den letzten
        {hours} Stunden
    rung_arrived_tpl: '{count} Messwerte in den letzten {hours} Stunden'
    rung_latest: '(zuletzt: {time})'
    rung_quality: Die Messwerte sehen gut aus
    rung_quality_sub: Häufige Messwerte — genug Detail für Mahlzeitenkurven.
    state_no_token: >-
        Erstellen Sie Ihren Token in {link}Schritt 2{link_end} und richten
        Sie dann die Automation auf Ihrem Telefon ein.
    state_token_unused: >-
        Token bereit ✓ — sobald Sie die Schritte 3 und 4 am Telefon
        abgeschlossen haben, erscheint der erste Export hier.
    state_waiting: >-
        Ihr Telefon hat sich verbunden ✓ — jetzt warten wir auf
        Glukose-Messwerte. Nach dem Export (Schritt 4) erscheinen sie meist
        innerhalb einer Minute. Kommt nichts an, prüfen Sie in der
        Health-App, ob Ihr Sensor Blood-Glucose-Werte schreibt.
    state_sparse: >-
        <strong>Fast geschafft!</strong> Es kamen Messwerte an, aber zu wenige oder zu
        weit auseinander ({count} in den letzten zwei Tagen) für
        Mahlzeitenkurven. Das ist fast immer die Einstellung
        <strong>Summarize Data</strong>: Schalten Sie sie in den Export
        Settings Ihrer Automation <strong>aus</strong> und exportieren Sie
        erneut.
    state_dense: >-
        <strong>Es funktioniert!</strong> {count} Messwerte im Abstand von
        etwa {gap} Minuten — genau das, was Mahlzeitenkurven brauchen.
    success_heading: Sie sind verbunden
    success_lead: >-
        Ab jetzt fließt Ihre Glukose automatisch nach dem Zeitplan, den Sie
        in Health Auto Export gewählt haben. Das können Sie als Nächstes tun:
    success_chart: '{link}Sehen Sie Ihr Glukose-Diagramm{link_end} auf der Seite Gesundheitsdaten.'
    success_meal: >-
        {link}Erfassen Sie Ihre nächste Mahlzeit{link_end} — mit fließender
        Glukose bekommt jede Mahlzeit etwa 3 Stunden nach dem Essen ihre
        eigene Reaktionskurve.
    success_insights: >-
        {link}Öffnen Sie die Glukose-Analysen{link_end}, um zu sehen, welche
        Mahlzeiten Ihren Blutzucker am stärksten (und am wenigsten) bewegen.
    upsell: >-
        <strong>Ihre Glukose fließt — ein Bezahlplan macht etwas
        daraus.</strong> Die Bezahlpläne korrelieren jede erfasste Mahlzeit
        mit Ihren Messwerten: Reaktionskurven pro Mahlzeit, Ranglisten der
        stärksten Anstiege und der sanftesten Mahlzeiten, und mehr.
        {link}Pläne ansehen{link_end}
glucose_page:
    title: Glukose-Analysen
    heading: Glukose-Analysen
    vs_est: '% vs. Schätzung'
    locked_heading: CGM-Glukose-Korrelation
    locked_lead: >-
        Verbinden Sie Ihre kontinuierlichen Glukosedaten, um zu sehen, welche
        Mahlzeiten Ihre Glukose am stärksten und am wenigsten erhöht haben —
        und welche stärker ausschlugen, als ihre Nährwerte vermuten ließen.
