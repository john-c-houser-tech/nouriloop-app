    inflammation:
        heading: Ernährungs-Entzündungswert
        legend: >-
            −10 entzündungshemmend · 0 neutral · +10 entzündungsfördernd.
            Eine informative Schätzung aus erfassten Lebensmitteln — keine
            medizinische Beratung.
        about: >-
            <p class="mt-2 mb-1"><strong>Zeigt:</strong> eine tägliche
            Schätzung Ihres erfassten Essens von −10 (entzündungshemmend)
            bis +10 (entzündungsfördernd) — ein informatives
            Wellness-Signal, keine medizinische Beratung.</p> <p
            class="mb-1"><strong>Datenquelle:</strong> die erfassten
            Mahlzeiten jedes Tages — ihre analysierten Nährwerte und
            Zutatenlisten.</p> <p class="mb-1"><strong>Berechnung:</strong>
            eine reine Heuristik (ohne KI) kombiniert ein Nährstoff-Gerüst
            (gesättigtes Fett, Zucker und Natrium wirken fördernd;
            Ballaststoffe plus antioxidative Mikronährstoffe A/C/D/E, B6,
            Folat, B12, Mg, Zn, Se als % RDA wirken hemmend — Richtung nach
            dem Dietary Inflammatory Index) mit Anpassungen nach
            Lebensmittel-Stichwörtern (verarbeitetes Fleisch / Frittiertes /
            Zuckriges → fördernd; fetter Fisch, Olivenöl, Blattgemüse,
            Beeren, Kurkuma → hemmend, pro Mahlzeit gedeckelt), pro lokalem
            Tag summiert und auf −10…+10 begrenzt.</p>
        track_symptom: >-
            {link}Verfolgen Sie ein Symptom{link_end} (Gelenkschmerzen,
            Blähbauch, Kopfschmerz, Energie…), um auf der
            <strong>Symptome</strong>-Kachel zu sehen, wie es sich mit
            diesem Wert bewegt.
    symptom:
        heading: '{label} — Zusammenhänge'
        legend: >-
            Wie sich <strong>{label}</strong> zu dem verhält, was Sie
            gegessen haben — und, wenn Sie Gesundheitsdaten importieren, zu
            Ihren Körperwerten. Jeder Faktor bekommt sein eigenes
            Mini-Diagramm in seinen echten Einheiten, gestapelt unter
            {label}, sodass Sie senkrecht nach unten lesen können, ob sich
            ein Faktor am selben Tag bewegt hat. Unter jedem Diagramm listen
            wir nur die Faktoren mit einer <strong>statistisch
            signifikanten</strong> Korrelation.
        about: >-
            <p class="mt-2 mb-1"><strong>Zeigt:</strong> das tägliche Niveau
            von {label} (0–10), gestapelt über den anderen Faktoren, die Sie
            verfolgen, jeder in eigenen Einheiten. Der
            <em>Ernährung</em>-Stapel umfasst Protein, Kohlenhydrate, Fett,
            Ballaststoffe und Ihren Entzündungswert; der
            <em>Gesundheit</em>-Stapel Schritte, Blutzucker, Gewicht und
            Nachtschlaf (nur sichtbar, wenn Sie diese Werte importiert
            haben).</p> <p class="mb-1"><strong>Warum gestapelt statt
            überlagert:</strong> diese Faktoren haben sehr unterschiedliche
            Einheiten (Gramm vs. mg/dL vs. Schritte); auf einer gemeinsamen
            Achse gingen entweder die echten Zahlen verloren oder die Form
            im Durcheinander unter. Gestapelt behält jeder Faktor seine
            echte Skala, während alle Panels auf derselben Datumsachse
            liegen — fahren Sie über einen Punkt für den genauen Wert.</p>
            <p class="mb-1"><strong>Signifikante Korrelationen:</strong> für
            jeden Faktor berechnen wir ein Pearson-<em>r</em> für denselben
            und den nächsten Tag (Effekte können verzögert auftreten) sowie
            einen zweiseitigen Signifikanztest. Gelistet werden nur
            Korrelationen mit mindestens {minDays, plural, one {# gepaarten
            Tag} other {# gepaarten Tagen}} und p &lt; 0,05 — beschreibend,
            nicht ursächlich, und umso klarer, je mehr Sie erfassen.</p>
