# ── Öffentliche Marketing-Seiten (i18n Phase 4): /about, /pricing, /lp/* ─────
# Die „diabetes“-Seite verwendet in KEINER Sprache das Wort für die
# Erkrankung: nur „Glukose“ / „Blutzucker“ (Regel aus Marketing-Plan §2).
about:
    title: Ernährungstracking mit KI
    seo_description: >-
        Erfassen Sie Mahlzeiten per Foto, importieren Sie Rezepte, sehen Sie
        Ihren Entzündungswert, verbinden Sie Ihren CGM-Sensor und erhalten Sie
        persönliche Ernährungsziele.
    jsonld_description: >-
        Ernährungstracking mit KI: Mahlzeiten per Foto erfassen,
        Rezepte importieren, ein Entzündungswert für Ihre Ernährung,
        Glukose-Analysen per CGM und persönliche Ernährungsziele.
    hero_lead: >-
        NouriLoop macht aus ganz normalen Fotos Ihres Essens ein klares
        Bild davon, wie Sie sich ernähren — und verbindet es damit, wie Sie
        sich fühlen. Fotografieren Sie eine Mahlzeit, und die KI übernimmt
        den mühsamen Teil: Sie schätzt die Nährwerte, erkennt die Zutaten
        und stellt die richtigen Rückfragen. Mit der Zeit schließt
        NouriLoop den Kreis zwischen Ihrer Ernährung, Ihren
        Gesundheitswerten und Ihren Symptomen — damit Sie sehen, was
        wirklich wirkt.
    any_phone: >-
        Funktioniert mit dem Handy, das Sie bereits haben – iPhone oder Android.
        NouriLoop läuft im Browser Ihres Handys, es muss also nichts installiert
        werden.
    create_account: Konto erstellen
    sign_in: Anmelden
    plans: Der Einstieg ist kostenlos. Sie möchten mehr? {plans_link}Pläne ansehen{link_end}.
    disclaimer: >-
        NouriLoop ist ein informatives Wellness-Werkzeug, kein
        Medizinprodukt. Seine Werte und Analysen helfen Ihnen, Muster in
        Ihren eigenen Daten zu erkennen — sie sind kein medizinischer Rat
        und keine Diagnose.
    logging:
        heading: Essen erfassen ohne Aufwand
        items: >-
            <li><strong>Nährwerte per Foto</strong> — Fotografieren Sie
            Ihre Mahlzeit, und die KI von NouriLoop schätzt Kalorien,
            Protein, Kohlenhydrate, Fett, Ballaststoffe, Zucker und ein
            komplettes Panel an Vitaminen und Mineralstoffen.</li>
            <li><strong>Bestätigen &amp; Verfeinern</strong> — Jede
            Schätzung durchläuft eine kurze Prüfansicht, in der Sie Zutaten
            anpassen, ein bis zwei Rückfragen beantworten und alles
            feinjustieren können, bevor Sie speichern.</li>
            <li><strong>Portionskontrolle</strong> — Nur die Hälfte
            gegessen? Oder das Doppelte? Geben Sie an, wie viele Portionen
            es wirklich waren, und alle Zahlen passen sich sofort an.</li>
            <li><strong>Etikett für mehr Genauigkeit</strong> — Fügen Sie
            ein zweites Foto hinzu, etwa die Nährwerttabelle, und die KI
            kombiniert beide zu einer genaueren Schätzung.</li>
            <li><strong>Erfassen, wann es Ihnen passt</strong> — Am Tisch
            nicht dazu gekommen? Datieren Sie eine Mahlzeit einfach auf den
            Zeitpunkt zurück, zu dem Sie wirklich gegessen haben.</li>
            <li><strong>Favoriten</strong> — Speichern Sie Mahlzeiten, die
            Sie oft essen, und erfassen Sie sie mit einem Fingertipp erneut
            — ohne neue Analyse, ohne Wartezeit.</li>
            <li><strong>Rezept importieren</strong> —
            Fotografieren Sie eine Kochbuchseite oder eine
            handgeschriebene Rezeptkarte: NouriLoop liest
            Zutaten und Ergiebigkeit, berechnet die Nährwerte
            pro Portion und speichert das Rezept als Favorit —
            samt Zutaten und Zubereitungsschritten, damit Sie
            später danach kochen können.</li>
    nutrition:
        heading: Ihre Ernährung verstehen
        items: >-
            <li><strong>Tägliches Dashboard</strong> — Sehen Sie auf einen
            Blick, was Sie heute zu sich genommen haben und wo Ihre
            wichtigsten Signale stehen.</li> <li><strong>Trends über die
            Zeit</strong> — Anschauliche Diagramme Ihrer Ernährungs- und
            Gesundheitswerte, damit Sie erkennen, in welche Richtung es
            geht.</li> <li><strong>Nährstoffversorgung &amp;
            Supplement-Vorschläge</strong> — NouriLoop vergleicht Ihre
            letzte Woche mit den empfohlenen Zufuhrmengen und zeigt, wo Sie
            immer wieder zu kurz kommen.</li>
            <li><strong>Supplement-Tracking</strong> — Scannen Sie ein
            Supplement-Etikett mit der Kamera: NouriLoop liest die
            Nährwertangaben und rechnet Ihre täglichen Supplemente in die
            Versorgungsbilanz ein — die Vorschläge berücksichtigen also,
            was Sie bereits einnehmen.</li>
    loop:
        heading: 'Den Kreis schließen: Ernährung ↔ Wohlbefinden'
        items: >-
            <li><strong>Entzündungswert Ihrer Ernährung</strong> — Ein
            tägliches, leicht lesbares Signal dafür, wie entzündungsfördernd
            oder entzündungshemmend Ihre Essensauswahl war — auf Basis
            etablierter Ernährungsforschung.</li>
            <li><strong>Symptom-Check-ins</strong> — Verfolgen Sie die
            Symptome, die Ihnen wichtig sind (Gelenkschmerzen, Verdauung,
            Kopfschmerzen, Energie, geistige Klarheit oder eigene), mit einem
            kurzen täglichen Schieberegler, dessen Stimmungsgesicht dafür
            sorgt, dass die Skala immer gleich zu lesen ist.</li>
            <li><strong>Zusammenhänge pro Symptom</strong> — Jedes Symptom
            bekommt eine eigene Ansicht, die es Ihrer Ernährung (Protein,
            Kohlenhydrate, Fett, Ballaststoffe und Ihrem Entzündungswert) und
            Ihren Körperwerten (Schritte, Glukose, Gewicht, Schlaf)
            gegenüberstellt. NouriLoop rechnet die Statistik und zeigt nur
            Zusammenhänge, die in Ihren eigenen Daten statistisch signifikant
            sind — am selben Tag und am Folgetag, denn manche Effekte kommen
            verzögert.</li> <li><strong>„Was wäre wenn“-Prognosen</strong>
            <em>(Bezahlpläne)</em> — Sie fragen sich, was passiert, wenn Sie zwei
            Wochen lang jeden Tag Ihre Lieblingsmahlzeit essen? NouriLoop
            berechnet, wie sich Ihr Entzündungswert, Ihre Nährstoffe, Ihr
            Gewicht und Ihre Symptome voraussichtlich entwickeln würden — aus
            Ihrem eigenen Verlauf, erklärt in einfacher Sprache.</li>
            <li><strong>Glukose-Reaktion pro Mahlzeit</strong> — Wenn Sie
            einen kontinuierlichen Glukosesensor tragen, zeichnet NouriLoop
            die Blutzuckerreaktion jeder Mahlzeit nach, vergleicht sie mit
            dem, was die Nährwerte erwarten ließen, und zeigt, welche
            Mahlzeiten Ihre Werte am stärksten und am wenigsten ansteigen
            ließen.</li> <li><strong>AI Pattern Coach</strong>
            <em>(Bezahlpläne)</em> — Geht noch einen Schritt weiter: Eine
            KI-Tiefenanalyse liest Ihre eigenen Glukose-Reaktionen über alle
            Mahlzeiten hinweg — die Lebensmittel, Zeiten und Kombinationen
            dahinter — und schreibt eine persönliche Coaching-Zusammenfassung:
            die Muster, die sie sieht, und ein paar konkrete Anpassungen zum
            Ausprobieren. Vollständig auf Ihre eigenen Daten gestützt.</li>
    goals:
        heading: Persönliche Ziele & Coaching
        items: >-
            <li><strong>Ziele im Gespräch einrichten</strong> — Sagen Sie
            NouriLoop einfach „ich möchte mehr Ballaststoffe essen“, und ein
            KI-Coach macht daraus ein konkretes, messbares Ziel — auf Basis
            Ihrer eigenen Essgewohnheiten.</li> <li><strong>Geplante
            Check-ins</strong> — NouriLoop bewertet Ihren Fortschritt in dem
            Rhythmus, den Sie wählen, und liefert eine freundliche
            Zusammenfassung, ein Diagramm oder einen Bericht direkt in Ihr
            Postfach.</li> <li><strong>Coaching in Ihrem Ton</strong> — Drei
            einfache Regler bestimmen, wie die KI von NouriLoop mit Ihnen
            schreibt — von sachlich bis herzlich, von zugeknöpft bis
            verspielt, von einfach bis fachkundig — damit Ihre Check-ins und
            Analysen so klingen, wie Sie es mögen.</li> <li><strong>Sichere,
            realistische Ziele</strong> — Jedes Ziel wird mit sicheren
            Grenzwerten abgeglichen, und Sie werden gewarnt, bevor Sie ein
            Ziel setzen, das unsicher sein könnte.</li>
    health:
        heading: Ihre Gesundheitsdaten, wie Sie es möchten
        items: >-
            <li><strong>Umfassende Gesundheitswerte</strong> — Verfolgen Sie Gewicht,
            Blutzucker, Blutdruck, Herzfrequenz, Körperfett, Schritte und Schlafphasen
            direkt neben Ihrer Ernährung.</li> <li><strong>Einfache Importe</strong> —
            Holen Sie Ihren Verlauf aus Apple Health, gängigen Gesundheits-Export-Apps
            oder einer einfachen Tabelle.</li> <li><strong>Automatische
            Synchronisierung</strong> – Auf dem iPhone richten Sie einen automatischen
            Export ein, damit Ihr Handy neue Messwerte von selbst an NouriLoop sendet.
            Unter Android importieren Sie eine kompatible Datei aus einer
            Health-Export-App; die automatische Synchronisierung ist in Arbeit.</li>
    real_life:
        heading: Gemacht für den Alltag
        items: >-
            <li><strong>Kluge Erinnerungen</strong> — Optionale Anstupser,
            wenn Sie noch keine Mahlzeit erfasst haben, Ihre
            Gesundheitswerte veralten, Ihre Kalorien aus dem Rahmen fallen
            oder Ihre Nährstofflücken größer werden.</li>
            <li><strong>Benachrichtigungszentrale</strong> — Eine Glocke
            samt Posteingang direkt in der App sammelt Ihre Ziel-Check-ins
            und Erinnerungen an einem Ort — so geht nichts unter, selbst
            wenn Sie E-Mails auslassen.</li> <li><strong>E-Mail, SMS oder
            in der App</strong> — Erhalten Sie Benachrichtigungen und
            Ziel-Check-ins so, wie es Ihnen am liebsten ist.</li>
            <li><strong>Ihre Zeitzone, Ihr Tag</strong> — „Heute“ bedeutet
            immer <em>Ihren</em> lokalen Tag, wo immer Sie gerade
            sind.</li> <li><strong>GLP-1-Modus</strong> — Ein eigener
            Modus für Menschen, die GLP-1-Medikamente nehmen — mit
            Protein-Schwerpunkt, Portionshilfe und einem Blick auf
            typische Übelkeitsauslöser.</li>
    privacy:
        heading: Privat & sicher
        items: >-
            <li><strong>Persönliche Konten für mehrere Nutzer</strong> — Ihre
            Daten gehören Ihnen und bleiben von anderen Konten getrennt und
            geschützt.</li> <li><strong>Klare Datenschutzpraxis</strong> —
            Hinweise in verständlicher Sprache erklären, wie Ihre
            Gesundheitsdaten verarbeitet werden — einschließlich aller daran
            beteiligten Dienste. Lesen Sie unseren {health_link}Hinweis zum
            Umgang mit Gesundheitsdaten{link_end}.</li>
    closing: >-
        NouriLoop — schließen Sie den Kreis zwischen dem, was Sie essen, und
        dem, wie Sie sich fühlen.
    company: >-
        NouriLoop wird entwickelt und betrieben von NouriLoop LLC, einem
        Unternehmen aus Oregon (USA). NouriLoop LLC ist außerdem der
        Entwickler von <strong>Campaigner</strong>.
