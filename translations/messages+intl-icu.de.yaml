            Messwerte, importiert über Apple Health, Health Auto Export oder
            die Ingestion-API.</p> <p
            class="mb-1"><strong>Berechnung:</strong> pro lokalem Tag ist
            die Linie der Tagesdurchschnitt und das schattierte Band die
            Min-Max-Spanne; keine Umrechnung außer der
            Einheiten-Normalisierung (z. B. lb→kg). Das
            Gut/Beobachten/Achtung-Signal auf der Übersichtskachel bewertet
            den jeweils letzten Messwert anhand einfacher,
            nicht-medizinischer Schwellwerte.</p>
    calories:
        heading: Tägliche Kalorien
        about: >-
            <p class="mt-2 mb-1"><strong>Zeigt:</strong> die pro Tag
            erfassten Gesamtkalorien.</p> <p
            class="mb-1"><strong>Datenquelle:</strong> die analysierten
            Kalorien Ihrer erfassten Mahlzeiten.</p> <p
            class="mb-1"><strong>Berechnung:</strong> Summe der
            Mahlzeiten-Kalorien pro lokalem Tag. Das Übersichts-Signal
            schlägt an, wenn der Tagesdurchschnitt unter 1200 oder über
            3500 kcal liegt.</p>
    macros:
        heading: Durchschnittliche Makros
        about: >-
            <p class="mt-2 mb-1"><strong>Zeigt:</strong> Ihre
            durchschnittliche tägliche Verteilung von Protein /
            Kohlenhydraten / Fett, in Kalorien.</p> <p
            class="mb-1"><strong>Datenquelle:</strong> erfasste Mahlzeiten
            im gewählten Zeitraum.</p> <p
            class="mb-1"><strong>Berechnung:</strong> durchschnittliche
            Gramm/Tag über {days, plural, one {den letzten # Tag} other {die
            letzten # Tage}} × 4 (Protein), 4 (Kohlenhydrate), 9 (Fett) kcal
            pro Gramm.</p>
