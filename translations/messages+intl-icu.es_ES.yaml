        Considera un suplemento de vitamina A o aumenta el hígado, el boniato
        y las zanahorias.
    vitaminB3: >-
        Considera un suplemento de complejo B o come más aves, pescado y
        cacahuetes.
    vitaminB6: >-
        Considera un suplemento de vitamina B6 o come más aves, pescado,
        patatas y plátanos.
    vitaminB9: >-
        Considera un suplemento de folato o complejo B. Buenas fuentes: hojas
        verdes, alubias.
    calcium: >-
        Considera un suplemento de calcio o aumenta los lácteos, las leches
        vegetales enriquecidas y las hojas verdes.
    potassium: >-
        Aumenta los alimentos ricos en potasio: plátanos, aguacates, boniatos,
        alubias.
    zinc: >-
        Considera un suplemento de zinc o come más ostras, ternera y pipas de
        calabaza.
