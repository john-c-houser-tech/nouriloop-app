        lead: >-
            Haz una foto clara del panel de <strong>datos del
            suplemento</strong>. Si la etiqueta rodea el frasco, hazle
            <strong>dos o tres fotos</strong> y selecciónalas todas — las
            leeremos juntas y combinaremos los resultados. Podrás revisar y
            editar todo antes de guardar.
