# European-Spanish OVERRIDE catalog — carries ONLY the keys whose wording
# genuinely differs from base `es` (LatAm-leaning); everything else falls back
# es_ES → es → en. Keeps the base catalog's tú. Keep this file sparse.
common:
    session_expired: Tu sesión ha caducado — inténtalo de nuevo.
auth:
    login:
        hero_lead: >-
            Haz una foto de tu comida. Nosotros la analizamos. Mira cómo se
            relaciona con tu nutrición, tu índice de inflamación, tu glucosa
            en sangre y tu sueño.
    reset:
        retry: ¿No te ha llegado?
cgm:
    step1_install: >-
        En tu iPhone, instala {link}Health Auto Export – JSON+CSV{link_end}
        desde el App Store. ¿Lees esto en un ordenador? Apunta la cámara
        de tu iPhone al código QR de abajo para ir directo.
    step4_body: >-
        Guarda la automatización y ejecútala una vez a mano — ábrela y toca su
        botón manual de <strong>export / update</strong>. (Después de esta
        primera vez, la app envía lecturas nuevas según el horario que
        elegiste.)
    state_waiting: >-
        Tu teléfono conectó ✓ — ahora esperamos lecturas de glucosa. Después
        de ejecutar la exportación (Paso 4) suelen aparecer en un minuto. Si no
        llega nada, revisa en la app Salud que tu sensor esté escribiendo
        lecturas de Blood Glucose.
glucose_page:
    not_connected: >-
        ¿Todavía no has conectado tu sensor? {link}El asistente
        guiado{link_end} tarda unos 10 minutos.
    coach_pitch: >-
        Ve más allá de las clasificaciones: un análisis profundo con IA lee
        tus respuestas de glucosa frente a los alimentos, horarios y
        combinaciones detrás de ellas — mostrando patrones personales («el
        arroz te dispara, pero no con alubias») y cambios concretos que
        probar.
health:
