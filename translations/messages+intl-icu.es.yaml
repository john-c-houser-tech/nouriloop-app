        reales — se importan igual, pero un día entero se colapsa en un solo
        número, y {app_name} necesita las lecturas de ~5 minutos para dibujar
        tus curvas de comida. El resto puede quedarse como viene (Export
        Format <code>JSON</code>, Export Version v2, Date Range Default);
