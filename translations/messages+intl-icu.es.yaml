        glucose_dots: Puntos rojos = pico de glucosa vespertina (6–10 PM).
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> horas totales de
            sueño por noche, una línea opcional cena→sueño y puntos de glucosa
            vespertina.</p> <p class="mb-1"><strong>Fuente de datos:</strong>
            etapas de sueño importadas (Core/Deep/REM/en cama), horas de las
            comidas y lecturas de glucosa.</p> <p class="mb-1"><strong>Cómo se
            calcula:</strong> horas totales = suma de las etapas de sueño de
            la noche; brecha = horas entre la cena y el inicio del sueño;
            punto de glucosa vespertina = pico en {unit} de 6–10 PM. La tabla
            de abajo empareja la cena de cada noche, la glucosa vespertina
            (pico 6–10 PM), la brecha, la glucosa nocturna (promedio de
            medianoche a 6 AM) y el sueño, con colores según umbrales
            fijos.</p>
        table_heading: Cena → Glucosa → Sueño
        table_legend: >-
            Glucosa vespertina = pico en {unit} de 6–10 PM. Glucosa nocturna =
            promedio en {unit} de medianoche a 6 AM. Colores: <span
            class="badge bg-success">bien</span> <span class="badge bg-warning
            text-dark">vigilar</span> <span class="badge
            bg-danger">alto</span>
