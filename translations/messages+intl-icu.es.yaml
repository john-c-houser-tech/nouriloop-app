            <li><strong>La comida casera también
            cuenta.</strong> Fotografía una receta — una página
            de un libro de cocina o una tarjeta escrita a mano —
            y NouriLoop calcula las calorías por porción una
            sola vez. Desde entonces, registrar ese platillo
            toma un toque.</li>
        day_heading: Mira la semana, no solo la comida
        day_alt: >-
            El panel de NouriLoop: las calorías y la proteína de hoy junto
            a tus promedios recientes
        day_items: >-
            <li><strong>Tu panel muestra cómo va el día</strong> — calorías
            y proteína frente a tus propios promedios recientes, no una
            meta genérica.</li> <li><strong>Tu peso también cuenta:</strong>
            impórtalo desde Apple Health o tu báscula inteligente, y
            Tendencias lo grafica junto a lo que comiste.</li>
            <li><strong>Patrones de 7 a 90 días</strong> — porque una cena
            de antojo no importa; el mes sí.</li>
        goal_heading: Cuando estés lista o listo, define una meta en tus palabras
        goal_alt: >-
            La página de una meta nutricional: el objetivo, una gráfica de
            progreso y el historial de reportes
        goal_body: >-
            Dile a NouriLoop "mantenme por debajo de 2000 calorías al día"
            en un chat breve y se convierte en una meta concreta y medible.
            Con la frecuencia que elijas, NouriLoop evalúa las comidas que
            realmente registraste y te envía un reporte en lenguaje claro
            con una gráfica de progreso — ánimo cuando funciona, una
            corrección de rumbo cuando no.
        goal_tier_note: >-
            Definir metas es gratis, y toda cuenta incluye sus primeras
            {limit} revisiones. Loop (${loop_price}/mes, tu propia clave de
            IA) y Loop+ (${plus_price}/mes, IA incluida) las mantienen cada
            día o cada semana por correo; Loop+ también las envía por texto.
            Los planes de pago empiezan con una prueba gratuita de 7 días.
        founder: >-
            <strong>Por qué existe NouriLoop:</strong> lo construyó un
            desarrollador de más de 60 años, cansado de contadores de
            calorías que fingían que una entrada de base de datos podía ser
            exacta. Quería una herramienta honesta sobre lo que sabía — y
            que le avisara cuando estaba adivinando. Así que la construyó.
        footnote: >-
            Gratis para empezar — tus primeros 10 análisis de fotos al mes y
            las primeras {limit} revisiones de tus metas están incluidos. Los
            planes de pago empiezan en ${price}/mes (Loop, con tu propia clave
            de IA) y añaden revisiones diarias o semanales ilimitadas; las
            revisiones por texto son parte de Loop+. No se necesita tarjeta de
            crédito para registrarte.

