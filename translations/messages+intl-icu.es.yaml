# ── Páginas públicas de marketing (i18n Fase 4): /about, /pricing, /lp/* ────
# La página "diabetes" nunca usa la palabra de la condición en NINGÚN idioma:
# solo "glucosa" / "azúcar en sangre" (regla del Plan de Marketing §2).
about:
    title: Seguimiento nutricional con IA
    seo_description: >-
        Registra tus comidas con una foto, importa recetas, mira tu índice de
        inflamación, conecta tu MCG y recibe metas de nutrición
        personalizadas.
    jsonld_description: >-
        Seguimiento nutricional con IA: registro de comidas por
        foto, importación de recetas, un índice de inflamación de tu
        dieta, análisis de glucosa con MCG y metas de nutrición
        personalizadas.
    hero_lead: >-
        NouriLoop convierte fotos cotidianas de tu comida en una imagen
        clara de cómo comes — y lo conecta con cómo te sientes. Toma una
        foto de tu comida y la IA hace la parte tediosa: estimar la
        nutrición, detectar los ingredientes y hacer las preguntas
        correctas. Con el tiempo, NouriLoop cierra el ciclo entre tu dieta,
        tus métricas de salud y tus síntomas, para que veas qué está
        funcionando de verdad.
    any_phone: >-
        Funciona en el teléfono que ya tienes: iPhone o Android. NouriLoop se abre en
        el navegador de tu teléfono, así que no hay nada que instalar.
    create_account: Crea tu cuenta
    sign_in: Inicia sesión
    plans: Gratis para empezar. ¿Quieres más? {plans_link}Ve los planes{link_end}.
    disclaimer: >-
        NouriLoop es una herramienta educativa de bienestar, no un
        dispositivo médico. Sus puntuaciones y análisis están pensados para
        ayudarte a entender patrones en tus propios datos — no son consejo
        médico ni un diagnóstico.
    logging:
        heading: Registra tu comida sin esfuerzo
        items: >-
            <li><strong>Nutrición con solo una foto</strong> — Toma una foto
            de tu comida y la IA de NouriLoop estima calorías, proteína,
            carbohidratos, grasa, fibra, azúcar y un panel completo de
            vitaminas y minerales.</li> <li><strong>Confirma y
            refina</strong> — Cada estimación pasa por una pantalla de
            revisión rápida donde puedes ajustar ingredientes, responder una
            o dos preguntas aclaratorias y afinar antes de guardar.</li>
            <li><strong>Control de porciones</strong> — ¿Comiste la mitad?
            ¿El doble? Indica cuántas porciones comiste en realidad y todos
            los números se ajustan al instante.</li> <li><strong>Añade una
            etiqueta para más precisión</strong> — Adjunta una segunda foto,
            como la etiqueta de información nutricional, y la IA combina
            ambas para una estimación más precisa.</li>
            <li><strong>Registra a tu ritmo</strong> — ¿Olvidaste registrar
            en la mesa? Cambia la fecha de una comida a cuando realmente la
            comiste.</li> <li><strong>Favoritos</strong> — Guarda las
            comidas que comes seguido y vuelve a registrarlas con un toque —
            sin nuevo análisis, sin esperas.</li>
            <li><strong>Importa una receta</strong> — Fotografía
            una página de un libro de cocina o una tarjeta
            escrita a mano: NouriLoop lee los ingredientes y el
            rendimiento, calcula la nutrición por porción y la
            guarda como favorito — conservando los ingredientes
            y los pasos para que puedas cocinarla después.</li>
    nutrition:
        heading: Entiende tu nutrición
        items: >-
            <li><strong>Panel diario</strong> — Mira de un vistazo lo que
            has comido hoy y tus señales clave.</li>
            <li><strong>Tendencias en el tiempo</strong> — Gráficas de tu
            nutrición y tus métricas de salud para que veas hacia dónde
            vas.</li> <li><strong>Suficiencia de nutrientes y sugerencias de
            suplementos</strong> — NouriLoop revisa tu última semana de
            comidas frente a las ingestas recomendadas y señala dónde te
            estás quedando corto de forma constante.</li>
            <li><strong>Seguimiento de suplementos</strong> — Escanea la
            etiqueta de un suplemento con tu cámara: NouriLoop lee el panel
            de información y suma tus suplementos diarios a su análisis de
            suficiencia — así las sugerencias reflejan lo que ya tomas.</li>
    loop:
        heading: 'Cierra el ciclo: dieta ↔ cómo te sientes'
        items: >-
            <li><strong>Índice de inflamación de tu dieta</strong> — Una señal
            diaria y fácil de leer de qué tan pro o antiinflamatorias fueron
            tus elecciones de comida, basada en investigación nutricional
            establecida.</li> <li><strong>Chequeos de síntomas</strong> — Da
            seguimiento a los síntomas que te importan (dolor articular,
            digestión, dolores de cabeza, energía, claridad mental o los tuyos
            propios) con un control deslizante diario cuya carita de ánimo
            hace que la escala siempre se lea igual.</li>
            <li><strong>Relaciones por síntoma</strong> — Cada síntoma tiene
            su propia vista, que lo compara con tu dieta (proteína,
            carbohidratos, grasa, fibra y tu índice de inflamación) y tus
            métricas corporales (pasos, glucosa, peso, sueño). NouriLoop hace
            las estadísticas y muestra solo las relaciones estadísticamente
            significativas en tus propios datos — del mismo día y del día
            siguiente, porque algunos efectos tardan.</li>
            <li><strong>Predicciones «¿Y si…?»</strong> <em>(planes de pago)</em> — ¿Te
            preguntas qué pasaría si comieras tu comida favorita todos los
            días durante dos semanas? NouriLoop proyecta cómo evolucionarían
            probablemente tu índice de inflamación, tu nutrición, tu peso y
            tus síntomas — calculado a partir de tu propio historial y
            explicado en lenguaje sencillo.</li> <li><strong>Respuesta de
            glucosa por comida</strong> — Si usas un medidor continuo de
            glucosa, NouriLoop traza la respuesta de azúcar en sangre de cada
            comida, la compara con lo que su nutrición predecía y clasifica
            qué comidas te la subieron más y menos.</li> <li><strong>AI
            Pattern Coach</strong> <em>(planes de pago)</em> — Va un paso más allá: una
            IA analiza a fondo tus propias respuestas de glucosa entre comidas
            — los alimentos, los horarios y las combinaciones detrás de ellas
            — y escribe un resumen de coaching personalizado, señalando los
            patrones que ve y algunos ajustes concretos para probar. Basado
            por completo en tus datos.</li>
    goals:
        heading: Metas y coaching personalizados
        items: >-
            <li><strong>Configuración conversacional de metas</strong> — Dile
            a NouriLoop algo como «quiero comer más fibra» y un coach de IA lo
            convierte en una meta concreta y medible, basada en tus propios
            hábitos de comida.</li> <li><strong>Revisiones
            programadas</strong> — NouriLoop evalúa tu progreso con la
            frecuencia que elijas y te entrega un resumen amigable, una
            gráfica o un informe directo a tu bandeja de entrada.</li>
            <li><strong>Coaching con tu voz</strong> — Tres controles simples
            ajustan cómo te escribe la IA de NouriLoop — de clínica a cálida,
            de formal a juguetona, de sencilla a experta — para que tus
            revisiones y análisis suenen como a ti te gusta.</li>
            <li><strong>Objetivos seguros y realistas</strong> — Las metas se
            comparan con límites seguros, y te avisamos antes de que fijes un
            objetivo que podría no ser seguro.</li>
    health:
        heading: Tus datos de salud, a tu manera
        items: >-
            <li><strong>Métricas de salud completas</strong> — Registra peso, glucosa en
            sangre, presión arterial, frecuencia cardiaca, grasa corporal, pasos y
            etapas del sueño junto a tu nutrición.</li> <li><strong>Importaciones
            fáciles</strong> — Trae tu historial desde Apple Health, apps populares de
            exportación de salud o una simple hoja de cálculo.</li>
            <li><strong>Sincronización automática</strong>: en iPhone, conecta una
            exportación automática para que tu teléfono envíe las lecturas nuevas a
            NouriLoop por su cuenta. En Android, importa un archivo compatible desde una
            aplicación de exportación de salud; la sincronización automática está en
            camino.</li>
    real_life:
        heading: Hecho para la vida real
        items: >-
            <li><strong>Recordatorios inteligentes</strong> — Avisos
            opcionales cuando no has registrado una comida, tus lecturas de
            salud se están quedando viejas, tus calorías se ven fuera de
            rango o tus carencias de nutrientes van creciendo.</li>
            <li><strong>Centro de notificaciones</strong> — Una campana y
            una bandeja dentro de la app reúnen tus revisiones de metas y
            recordatorios en un solo lugar, para que nada se te pase aunque
            no revises el correo.</li> <li><strong>Correo, SMS o en la
            app</strong> — Recibe las notificaciones y revisiones de metas
            como prefieras.</li> <li><strong>Tu zona horaria, tu
            día</strong> — «Hoy» siempre significa <em>tu</em> día local,
            estés donde estés.</li> <li><strong>Modo GLP-1</strong> — Un
            modo dedicado para personas que usan medicamentos GLP-1, con
            guía enfocada en proteína, ayuda con las porciones y atención a
            los desencadenantes comunes de náuseas.</li>
    privacy:
        heading: Privado y seguro
        items: >-
            <li><strong>Cuentas personales multiusuario</strong> — Tus datos
            son tuyos, guardados aparte de otras cuentas y protegidos.</li>
            <li><strong>Prácticas de privacidad claras</strong> — Avisos en
            lenguaje sencillo explican cómo se manejan tus datos de salud,
            incluidos los servicios que participan en procesarlos. Consulta
            nuestro {health_link}Aviso de privacidad de datos de
            salud{link_end}.</li>
    closing: >-
        NouriLoop — cierra el ciclo entre lo que comes y cómo te sientes.
    company: >-
        NouriLoop es creado y operado por NouriLoop LLC, una empresa de
        Oregón (EE. UU.). NouriLoop LLC también es el desarrollador de
        <strong>Campaigner</strong>.
