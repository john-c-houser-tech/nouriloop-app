cgm:
    title: Conecta tu MCG
    heading: Conecta tu Lingo o Stelo
    lead: >-
        Una configuración única que envía tus lecturas de glucosa a {app_name}
        automáticamente, para que cada comida que registres tenga su propia
        curva de respuesta de glucosa.
    need_heading: Qué necesitas
    need_items: >-
        <li>Un sensor <strong>Abbott Lingo</strong> o <strong>Dexcom
        Stelo</strong> que ya muestre lecturas en la app
        <strong>Salud</strong> de Apple en tu iPhone.</li> <li>Tu
        <strong>iPhone</strong> y unos <strong>10 minutos</strong>.</li>
        <li>Una pequeña app auxiliar llamada <strong>Health Auto
        Export</strong> (Paso 1). Ella hace el envío; su función de
        sincronización automática requiere la pequeña suscripción propia de
        la app (Basic cuesta $2.99, o $6.99 por un año de Premium).</li>
    need_note: >-
        Antes de empezar: abre la app Salud y confirma que ves lecturas de
        glucosa recientes ahí. Si Salud no tiene lecturas, {app_name} tampoco
        puede recibirlas — revisa primero la app de tu sensor.
    step1_heading: Instala «Health Auto Export»
    step1_install: >-
        En tu iPhone, instala {link}Health Auto Export – JSON+CSV{link_end}
        desde el App Store. ¿Lees esto en una computadora? Apunta la cámara
        de tu iPhone al código QR de abajo para ir directo.
    qr_alt: Código QR del App Store
    step1_permissions: >-
        Al abrirla por primera vez, pide permiso para leer tus datos de
        Salud. Tocar <strong>Turn On All</strong> es lo más fácil — pero tú
        decides: si prefieres, activa solo lo que quieras que {app_name} vea.
        <strong>Blood Glucose</strong> (glucosa) es lo que este proceso
