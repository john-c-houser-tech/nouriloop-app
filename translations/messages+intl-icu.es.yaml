    fiber:
        seo_description: >-
            Da seguimiento a la fibra, las vitaminas y los minerales desde
            una foto de tu comida — sin buscar en bases de datos. Mira qué
            nutrientes te faltan de forma constante.
        title: Mide tu consumo de fibra desde una foto
        headline: >-
            Tu médico te dijo que comieras más fibra.<br>Así puedes saber si
            lo estás haciendo.
        lead: >-
            La mayoría de las apps no miden la fibra — o la esconden detrás
            de la captura manual en bases de datos, donde primero tienes que
            saber el alimento exacto. NouriLoop estima fibra, vitaminas y
