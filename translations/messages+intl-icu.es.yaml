        cta: Mide tu fibra gratis
        summary_alt: >-
            El resumen nutricional de una comida registrada: confianza de la
            IA, calorías y macros, y luego fibra, sodio, potasio, calcio,
            hierro, magnesio, zinc y vitaminas A y C
        photo_heading: Fibra desde una foto — sin buscar en bases de datos
        photo_items: >-
            <li><strong>Toma una foto de tu plato.</strong> NouriLoop estima
            la fibra junto a un panel completo de nutrientes — folato,
            magnesio, potasio, vitaminas de la A a la E y más de 15
