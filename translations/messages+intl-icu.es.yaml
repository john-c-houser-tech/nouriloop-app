        legend: Banda sombreada = rango mín–máx diario
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> medidas corporales
            importadas a lo largo del tiempo, con una banda de rango diario.
            Toca el botón de una métrica para añadir o quitar su línea.</p>
            <p class="mb-1"><strong>Fuente de datos:</strong> lecturas
            importadas vía Apple Health, Health Auto Export o la API de
            ingesta.</p> <p class="mb-1"><strong>Cómo se calcula:</strong> por
            día local la línea = promedio diario y la banda sombreada =
            mín–máx diario; sin más transformación que la normalización de
            unidades (p. ej. lb→kg). La insignia bien / vigilar / atención de
            cada mosaico evalúa su última lectura contra umbrales simples, no
            médicos.</p>
    calories:
        heading: Calorías diarias
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> calorías totales
            registradas por día.</p> <p class="mb-1"><strong>Fuente de
            datos:</strong> las calorías analizadas de tus comidas
            registradas.</p> <p class="mb-1"><strong>Cómo se
            calcula:</strong> suma de las calorías de las comidas por día
            local. La insignia del resumen avisa cuando el promedio diario cae
            por debajo de 1200 o por encima de 3500 kcal.</p>
    macros:
        heading: Macros promedio
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> tu reparto diario
            promedio de proteína / carbohidratos / grasa, en calorías.</p> <p
            class="mb-1"><strong>Fuente de datos:</strong> comidas registradas
            en el periodo seleccionado.</p> <p class="mb-1"><strong>Cómo se
            calcula:</strong> gramos promedio/día de {days, plural, one {el
            último # día} other {los últimos # días}} × 4 (proteína), 4
            (carbohidratos), 9 (grasa) kcal por gramo.</p>
