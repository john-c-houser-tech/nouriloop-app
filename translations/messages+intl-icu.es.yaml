        últimos # días}}
    last_days: '({days, plural, one {último # día} other {últimos # días}})'
    inflammation:
        heading: Índice de inflamación dietética
        legend: >-
            −10 antiinflamatorio · 0 neutral · +10 proinflamatorio. Una
            estimación educativa a partir de los alimentos registrados — no es
            consejo médico.
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> una estimación
            diaria de −10 (anti-) a +10 (proinflamatorio) de tu comida
            registrada — una señal educativa de bienestar, no consejo
            médico.</p> <p class="mb-1"><strong>Fuente de datos:</strong> las
            comidas registradas de cada día — su nutrición analizada y su
            lista de ingredientes.</p> <p class="mb-1"><strong>Cómo se
            calcula:</strong> una heurística pura (sin IA) combina una base de
            nutrientes (grasa saturada, azúcar y sodio empujan hacia pro;
            fibra + micronutrientes antioxidantes A/C/D/E, B6, folato, B12,
            Mg, Zn, Se como %IDR empujan hacia anti — direccionalidad según el
            Índice Inflamatorio Dietético) con ajustes por palabras clave de
            alimentos (carnes procesadas / frituras / azucarados → pro;
            pescado graso, aceite de oliva, hojas verdes, bayas, cúrcuma →
            anti, con tope por comida), sumada por día local y acotada a
            −10…+10.</p>
        track_symptom: >-
            {link}Registra un síntoma{link_end} (dolor articular, hinchazón,
            dolor de cabeza, energía…) para ver cómo se mueve con este índice
            en el mosaico de <strong>Síntomas</strong>.
    symptom:
        heading: 'Relaciones de {label}'
        legend: >-
            Cómo se comporta <strong>{label}</strong> frente a lo que comiste
            — y, si importas datos de salud, frente a tus métricas corporales.
            Cada factor tiene su propia mini gráfica en sus unidades reales,
            apilada bajo {label} para que recorras hacia abajo y veas si un
            factor se movió el mismo día. Bajo cada gráfica listamos solo los
            factores con una correlación <strong>estadísticamente
            significativa</strong>.
        about: >-
            <p class="mt-2 mb-1"><strong>Muestra:</strong> el nivel diario de
            {label} (0–10) apilado sobre los demás factores que registras,
            cada uno en sus propias unidades. La pila de <em>Dieta</em> cubre
            proteína, carbohidratos, grasa, fibra y tu índice de inflamación;
            la de <em>Salud</em> cubre pasos, glucosa, peso y sueño nocturno
            (solo si has importado esas métricas).</p> <p
            class="mb-1"><strong>Por qué apiladas y no superpuestas:</strong>
            estos factores usan unidades muy distintas (gramos vs mg/dL vs
            pasos); superponerlos en un mismo eje esconde los números reales o
            entierra la forma en ruido. Apilar conserva la escala real de cada
            factor alineando todos los paneles en el mismo eje de fechas —
            pasa el cursor por un punto para ver su valor exacto.</p> <p
            class="mb-1"><strong>Correlaciones significativas:</strong> para
            cada factor calculamos una <em>r</em> de Pearson el mismo día y al
            día siguiente (los efectos pueden tardar), y una prueba de
            significancia de dos colas. Solo se listan correlaciones con al menos {minDays, plural, one {#
            día coincidente} other {# días coincidentes}} y p &lt; 0.05 — descriptivas, no
            causales, y más claras cuanto más registres.</p>
        diet_heading: Dieta y {label}
        health_heading: Métricas de salud y {label}
        diet_corr: Correlaciones significativas con la dieta
        health_corr: Correlaciones significativas con la salud
        corr_line: >-
            <strong>{factor}</strong> {relation} {label} ({lag}, r = {r},
