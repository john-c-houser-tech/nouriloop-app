    step3_lead: >-
        En la app Health Auto Export, abre <strong>Automations</strong> y
        crea una automatización <strong>REST API</strong> nueva. Escribe
        exactamente estos valores — usa los botones Copiar y pega en tu
        teléfono (si tienes iCloud en ambos, copiar aquí suele dejarte pegar
        allá):
