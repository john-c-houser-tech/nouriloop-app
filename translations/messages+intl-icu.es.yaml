            tus suplementos guardados
        gaps_intro: >-
            Un solo día bueno no responde la pregunta de tu médico — la
            semana sí. NouriLoop revisa tus últimos 7 días frente a las
            ingestas recomendadas y señala los nutrientes en los que te
