            confianza de la IA, calorías y macros, y el panel completo de
            nutrientes debajo
        photo_heading: Toma una foto. Olvídate de buscar en bases de datos.
        photo_items: >-
            <li><strong>Registra una comida en segundos.</strong> Toma una
