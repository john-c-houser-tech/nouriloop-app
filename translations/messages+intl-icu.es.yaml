supp_suggestion:
    fiber: >-
        Considera un suplemento de fibra (cáscara de psyllium) o come más
        legumbres, granos integrales y verduras.
    vitaminA: >-
        Considera un suplemento de vitamina A o aumenta el hígado, el camote y
        las zanahorias.
    vitaminB1: >-
        Considera un suplemento de complejo B o come más granos integrales y
        legumbres.
    vitaminB2: >-
        Considera un suplemento de complejo B o come más lácteos, huevos y
        carnes magras.
    vitaminB3: >-
        Considera un suplemento de complejo B o come más aves, pescado y
        cacahuates.
    vitaminB6: >-
        Considera un suplemento de vitamina B6 o come más aves, pescado, papas
        y plátanos.
    vitaminB9: >-
        Considera un suplemento de folato o complejo B. Buenas fuentes: hojas
        verdes, frijoles.
    vitaminB12: >-
        Considera un suplemento de vitamina B12 (especialmente importante en
        dietas basadas en plantas).
    vitaminC: >-
        Considera un suplemento de vitamina C o come más cítricos, pimientos y
        brócoli.
    vitaminD: >-
        Considera un suplemento de vitamina D3 — la mayoría tiene deficiencia,
        sobre todo en interiores.
    vitaminE: >-
        Considera un suplemento de vitamina E o come más nueces, semillas y
        aceites vegetales.
    vitaminK: >-
        Considera un suplemento de vitamina K2 o come más hojas verdes y
        fermentados.
    calcium: >-
        Considera un suplemento de calcio o aumenta los lácteos, las leches
        vegetales fortificadas y las hojas verdes.
    iron: >-
        Considera un suplemento de hierro — consulta primero a tu médico, el
        exceso de hierro es dañino.
    magnesium: >-
        Considera un suplemento de glicinato de magnesio — es una deficiencia
        común y ayuda a dormir.
    potassium: >-
        Aumenta los alimentos ricos en potasio: plátanos, aguacates, camotes,
        frijoles.
    zinc: >-
        Considera un suplemento de zinc o come más ostiones, res y semillas de
        calabaza.
    selenium: >-
        Dos nueces de Brasil al día cubren la IDR de selenio, o considera un
        suplemento.
