    sleep:
        heading: Sleep
        bars: Bars = total sleep hours.
        gap_line: Orange line = hours from dinner to sleep onset.
        glucose_dots: Red dots = evening glucose peak (6–10 PM).
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> nightly total sleep
            hours, an optional dinner→sleep gap line, and evening glucose
            dots.</p> <p class="mb-1"><strong>Data source:</strong> imported
            sleep-stage data (Core/Deep/REM/inBed), meal timestamps, and
            glucose readings.</p> <p class="mb-1"><strong>How it's
            calculated:</strong> total hours = sum of a night's sleep stages;
            gap = hours from dinner to sleep onset; evening glucose dot =
            peak {unit} from 6–10 PM. The table below pairs each night's
            dinner, evening glucose (peak 6–10 PM), gap, overnight glucose
            (average midnight–6 AM) and sleep, color-coded by fixed
            thresholds.</p>
