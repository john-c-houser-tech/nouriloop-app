cgm:
    title: Connect Your CGM
    heading: Connect Your Lingo or Stelo
    lead: >-
        A one-time setup that sends your glucose readings to NouriLoop
        automatically, so every meal you log gets its own blood-sugar
        response curve.
    need_heading: What you'll need
    need_items: >-
        <li>An <strong>Abbott Lingo</strong> or <strong>Dexcom Stelo</strong>
        sensor that's already showing readings in the Apple
        <strong>Health</strong> app on your iPhone.</li> <li>Your
        <strong>iPhone</strong> and about <strong>10 minutes</strong>.</li>
        <li>A small helper app called <strong>Health Auto Export</strong>
        (Step 1). It does the sending; its automatic-sync feature needs the
        app's own small subscription (Basic is $2.99, or $6.99 for a year of
        Premium).</li>
    need_note: >-
        Before you start: open the Health app and confirm you can see recent
        glucose readings there. If Health has no readings, NouriLoop can't
        receive any either — check your sensor's own app first.
    step1_heading: Install "Health Auto Export"
    step1_install: >-
        On your iPhone, install {link}Health Auto Export – JSON+CSV{link_end}
        from the App Store. Reading this on a computer? Point your iPhone
        camera at the QR code below to jump straight there.
    qr_alt: App Store QR code
    step1_permissions: >-
        When you first open it, it asks for permission to read your Health
        data. Tapping <strong>Turn On All</strong> is easiest — but you're in
        control: if you prefer, turn on only what you want NouriLoop to see.
        <strong>Blood Glucose</strong> is the one this setup needs;
        <strong>Weight, Steps, Sleep, Heart Rate, and Blood Pressure</strong>
        are also put to good use in your charts and trends.
    permissions_alt: Health access prompt with Blood Glucose enabled
    step2_heading: Create your NouriLoop access token
    step2_lead: >-
        The token is like a special password that lets the helper app — and
        only it — send health data to your NouriLoop account.
    token_reveal: Your new token — you'll paste it in Step 3
    copy: Copy
    copied: Copied
    token_once: >-
        For your security this is the only time it's shown — but don't worry
        about memorizing it: Step 3 below already includes it, ready to copy.
    token_again: >-
        You already have a token, but for your security we only show a token
        once. That's fine — just create a fresh one and use it below.
    create_token: Create my token
    step3_heading: Set up the automation in Health Auto Export
    step3_lead: >-
        In the Health Auto Export app, open <strong>Automations</strong> and
        create a new <strong>REST API</strong> automation. Enter exactly
        these values — use the Copy buttons and paste on your phone (if
        you're signed in to iCloud on both, copying here usually lets you
        paste there):
    row_url: URL
    row_method: Method
    row_format: Export format
    row_header_name: Header name
    row_header_value: Header value
    bearer_hint: >-
        <code>Bearer</code> + a space + your token — do {link}Step
        2{link_end} first and this fills in for you.
    row_data_type: Data type
    data_type_body: >-
        <strong>Health Metrics</strong>, then under "Select Health Metrics"
        tapping <strong>Select All</strong> is easiest — NouriLoop charts
        glucose, weight, steps, sleep, heart rate, and blood pressure, and
        simply ignores anything else. Prefer to share less? Select only
        <strong>Blood Glucose</strong> (the one this setup needs) plus
        whichever of the others you want NouriLoop to see.
    row_cadence: Sync cadence
    cadence_body: >-
        Once a <strong>day</strong> is plenty — each morning's sync brings
        yesterday's curves. Prefer same-day curves? A faster cadence (say,
        hourly) is fine too; NouriLoop ignores readings it already has.
    summarize_warning: >-
        <strong>One setting matters more than any other:</strong> in Export
        Settings, turn <strong>Summarize Data off</strong>. When it's on, the
        app sends daily summaries instead of your actual readings — they
        still import, but a whole day collapses into a single number, and
        NouriLoop needs the ~5-minute readings to draw your meal curves. The
        rest are fine as they come (Export Format <code>JSON</code>, Export
        Version v2, Date Range Default); turning <strong>Batch Requests
        on</strong> is a good idea — it splits a big first export into
        smaller sends.
    hae_screen_alt: Health Auto Export — {name} screen
    step4_heading: Send your first export
    step4_body: >-
        Save the automation, then run it once by hand — open it and tap its
        manual <strong>export / update</strong> button. (After this first
        time, the app sends new readings on the schedule you chose.)
    manual_export_alt: Health Auto Export — manual export trigger
    step5_heading: Watch it arrive
    step5_lead: >-
        This page checks for your data automatically every few seconds —
        leave it open while you finish the steps on your phone.
    noscript: (JavaScript is off in this browser — refresh the page to update.)
    rung_token: Token created
    rung_token_sub: Step 2 — your access token exists.
    rung_phone: Your phone reached NouriLoop
    rung_phone_sub: The token was used recently — the automation connected.
    rung_arrived: Glucose readings arrived
    rung_arrived_sub: >-
        {count, plural, one {# reading} other {# readings}} in the last
        {hours} hours
    rung_arrived_tpl: '{count} readings in the last {hours} hours'
    rung_latest: '(latest: {time})'
    rung_quality: Readings look right
    rung_quality_sub: Frequent readings — enough detail for meal curves.
    state_no_token: >-
        Create your token in {link}Step 2{link_end}, then set up the
        automation on your phone.
    state_token_unused: >-
        Token ready ✓ — once you finish Steps 3 and 4 on your phone, its
        first export will show up here.
    state_waiting: >-
        Your phone connected ✓ — now waiting for glucose readings. After you
        run the export (Step 4) they usually appear within a minute. If
        nothing arrives, check in the Health app that your sensor is writing
        Blood Glucose readings.
    state_sparse: >-
        <strong>Almost!</strong> Readings arrived, but too few / too far
        apart ({count} in the last two days) for meal curves. This is almost
        always the <strong>Summarize Data</strong> setting: in your
        automation's Export Settings, turn it <strong>off</strong>, then
        export again.
    state_dense: >-
        <strong>It works!</strong> {count} readings, about {gap} minutes
        apart — exactly what meal curves need.
    success_heading: You're connected
    success_lead: >-
        From here on, your glucose flows in automatically on the schedule you
        chose in Health Auto Export. What to do next:
    success_chart: '{link}See your glucose chart{link_end} on the Health Metrics page.'
    success_meal: >-
        {link}Log your next meal{link_end} — with glucose flowing, each meal
        gets its own response curve about 3 hours after you eat.
    success_insights: >-
        {link}Open Glucose Insights{link_end} to see which meals move your
        blood sugar most (and least).
    upsell: >-
