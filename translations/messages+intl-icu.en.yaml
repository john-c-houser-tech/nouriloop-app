    inflammation:
        heading: Dietary Inflammation Score
        legend: >-
            −10 anti-inflammatory · 0 neutral · +10 pro-inflammatory. An
            educational estimate from logged foods — not medical advice.
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> a daily −10 (anti-)
            to +10 (pro-inflammatory) estimate of your logged food — an
            educational wellness signal, not medical advice.</p> <p
            class="mb-1"><strong>Data source:</strong> each day's logged meals
            — their analyzed nutrition and ingredient list.</p> <p
            class="mb-1"><strong>How it's calculated:</strong> a pure
            heuristic (no AI) blends a nutrient backbone (saturated fat,
            sugar, sodium push pro; fiber + antioxidant micros A/C/D/E, B6,
            folate, B12, Mg, Zn, Se as %RDA push anti — directionality per the
            Dietary Inflammatory Index) with food-keyword adjustments
            (processed meat / fried / sugary → pro; fatty fish, olive oil,
            leafy greens, berries, turmeric → anti, capped per meal), summed
            per local day and clamped to −10…+10.</p>
        track_symptom: >-
            {link}Track a symptom{link_end} (joint pain, bloating, headache,
            energy…) to see how it moves with this score on the
            <strong>Symptoms</strong> tile.
    symptom:
        heading: '{label} relationships'
        legend: >-
            How <strong>{label}</strong> tracks against what you ate — and, if
            you import health data, your body metrics. Each factor gets its
            own mini chart in its real units, stacked under {label} so you can
            scan straight down to see whether a factor moved the same day.
            Below each chart we list only the factors with a
            <strong>statistically significant</strong> correlation.
        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> {label}'s daily level
            (0–10) stacked above the other factors you track, each in its own
            units. The <em>Diet</em> stack covers protein, carbs, fat, fiber
            and your dietary inflammation score; the <em>Health</em> stack
            covers steps, blood glucose, weight and nightly sleep (shown only
            if you've imported those metrics).</p> <p
            class="mb-1"><strong>Why stacked instead of overlaid:</strong>
            these factors use very different units (grams vs mg/dL vs steps),
            so overlaying them on one axis either hides the real numbers or
            buries the shape in clutter. Stacking keeps each factor's true
            scale while lining every panel up on the same date axis — hover
            any point for its exact value.</p> <p
            class="mb-1"><strong>Significant correlations:</strong> for every
            factor we compute a Pearson <em>r</em> both same-day and next-day
            (effects can lag), and a two-tailed significance test. Only
            correlations with at least {minDays, plural, one {# matched day}
            other {# matched days}} and p &lt; 0.05 are listed — descriptive, not causal, and clearer the more you
            log.</p>
        diet_heading: Diet & {label}
        health_heading: Health metrics & {label}
        diet_corr: Significant diet correlations
        health_corr: Significant health correlations
        corr_line: >-
            <strong>{factor}</strong> {relation} {label} ({lag}, r = {r},
            {n, plural, one {# day} other {# days}}).
        corr_positive: rose and fell together with
        corr_negative: moved opposite to
        same_day: same day
        next_day: next day
        inflammation_heading: >-
            Inflammation ↔ {label} — {n, plural, one {# matched day} other {#
            matched days}}
        same_day_avg: >-
            Same-day {label} averaged <strong>{pro}</strong> on
            pro-inflammatory days vs <strong>{other}</strong> on other
