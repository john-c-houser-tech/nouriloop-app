        about: >-
            <p class="mt-2 mb-1"><strong>Shows:</strong> imported body
            measurements over time, with a daily range band. Tap a metric
            button to add/remove its line.</p> <p class="mb-1"><strong>Data
            source:</strong> readings imported via Apple Health, Health Auto
            Export, or the ingestion API.</p> <p class="mb-1"><strong>How
            it's calculated:</strong> per local day the line = daily average
