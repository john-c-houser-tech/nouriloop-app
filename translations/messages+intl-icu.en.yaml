about:
    title: AI-Powered Nutrition Tracking
    seo_description: >-
        Track meals with a photo, import recipes, see your inflammation score,
        connect your CGM, and get personalized nutrition goals.
    jsonld_description: >-
        AI-powered nutrition tracking: photo meal logging, recipe
        import, a dietary inflammation score, CGM glucose insights,
        and personalized nutrition goals.
    hero_lead: >-
        NouriLoop turns everyday photos of your food into a clear picture of
        how you eat — and connects it to how you feel. Snap a meal, and AI
        does the tedious part: estimating nutrition, spotting ingredients,
        and asking the right questions. Over time, NouriLoop closes the loop
        between your diet, your health metrics, and your symptoms, so you
        can see what's actually working.
    any_phone: >-
        Works on the phone you already have — iPhone or Android. NouriLoop runs
        in your phone's browser, so there's nothing to install.
    create_account: Create your account
    sign_in: Sign in
    plans: Free to start. Want Loop+? {plans_link}See plans{link_end}.
    disclaimer: >-
        NouriLoop is an educational wellness tool, not a medical device. Its
        scores and insights are designed to help you understand patterns in
        your own data — they are not medical advice or diagnosis.
    logging:
        heading: Effortless food logging
        items: >-
            <li><strong>Snap-a-photo nutrition</strong> — Take a picture of
            your meal and NouriLoop's AI estimates calories, protein, carbs,
            fat, fiber, sugar, and a full panel of vitamins and
            minerals.</li> <li><strong>Confirm &amp; Refine</strong> — Every
            estimate gets a quick review screen where you can adjust
            ingredients, answer a clarifying question or two, and fine-tune
            before saving.</li> <li><strong>Portion control</strong> — Ate
            half? Ate double? Set how many servings you actually had and
            every number scales instantly.</li> <li><strong>Add a label for
            accuracy</strong> — Attach a second photo, like a
            nutrition-facts label, and the AI combines both for a sharper
            estimate.</li> <li><strong>Log on your schedule</strong> —
            Forgot to log at the table? Backdate a meal to when you actually
            ate it.</li> <li><strong>Favorites</strong> — Save the meals you
            eat often and re-log them in one tap — no re-analysis, no
            waiting.</li>
            <li><strong>Import a recipe</strong> — Photograph a
            cookbook page or a handwritten recipe card, and
            NouriLoop reads the ingredients and yield, works out
            per-serving nutrition, and saves it as a favorite —
            keeping the ingredients and steps so you can cook
            from it later.</li>
    nutrition:
        heading: Understand your nutrition
        items: >-
            <li><strong>Daily dashboard</strong> — See today's intake and
            key signals at a glance.</li> <li><strong>Trends over
            time</strong> — Visual charts of your nutrition and health
            metrics so you can spot the direction you're heading.</li>
            <li><strong>Nutrient adequacy &amp; supplement
            suggestions</strong> — NouriLoop reviews your last week of
            eating against recommended intakes and flags where you're
            consistently coming up short.</li> <li><strong>Supplement
            tracking</strong> — Scan a supplement label with your camera,
            and NouriLoop reads the facts panel and folds your daily
            supplements into its adequacy picture — so suggestions reflect
            what you already take.</li>
    loop:
        heading: 'Close the loop: diet ↔ how you feel'
        items: >-
            <li><strong>Dietary inflammation score</strong> — A daily,
            easy-to-read signal of how pro- or anti-inflammatory your food
            choices were, based on established nutrition research.</li>
            <li><strong>Symptom check-ins</strong> — Track the symptoms that
            matter to you (joint pain, digestion, headaches, energy, mental
            clarity, or your own custom ones) with a quick daily slider whose
            mood face keeps the scale reading the same way every time.</li>
            <li><strong>Per-symptom relationships</strong> — Each symptom gets
            its own view, charting it against your diet (protein, carbs, fat,
            fiber, and your inflammation score) and your body metrics (steps,
            glucose, weight, sleep). NouriLoop runs the statistics and shows
            only the relationships that are statistically significant in your
            own data — both same-day and next-day, since some effects
            lag.</li> <li><strong>"What if?" predictions</strong>
            <em>(Loop+)</em> — Wondering what eating your favorite meal every
            day for two weeks would do? NouriLoop projects how your
            inflammation score, nutrition, weight, and symptoms would likely
            trend — computed from your own history and explained in plain
            English.</li> <li><strong>Glucose response insights</strong> — If
            you use a continuous glucose monitor, NouriLoop maps each meal's
            blood-sugar response, compares it to what your meal's nutrition
            predicted, and ranks which meals spiked you most and least.</li>
            <li><strong>AI Pattern Coach</strong> <em>(Loop+)</em> — Goes a
            step further: an AI deep-dive reads your own glucose responses
            across meals — the foods, timing, and combinations behind them —
            and writes a personalized coaching summary, calling out the
            patterns it sees and a few concrete adjustments to try. Grounded
            entirely in your data.</li>
    goals:
        heading: Personalized goals & coaching
        items: >-
            <li><strong>Conversational goal setup</strong> — Tell NouriLoop
            something like "I want to eat more fiber," and an AI coach turns
            it into a concrete, measurable goal grounded in your own eating
            habits.</li> <li><strong>Scheduled check-ins</strong> — NouriLoop
            evaluates your progress on a schedule you choose and delivers a
            friendly summary, chart, or report straight to your inbox.</li>
            <li><strong>Coaching in your voice</strong> — Three simple sliders
            tune how NouriLoop's AI writes to you — from clinical to warm,
            buttoned-up to playful, plain-and-simple to expert — so your
            check-ins and insights sound the way you like.</li>
            <li><strong>Safe, realistic targets</strong> — Goals are checked
            against safe limits, and you're warned before setting a target
            that could be unsafe.</li>
    health:
        heading: Your health data, your way
        items: >-
            <li><strong>Rich health metrics</strong> — Track weight, blood
            glucose, blood pressure, heart rate, body fat, steps, and sleep
            stages alongside your nutrition.</li> <li><strong>Easy
            imports</strong> — Bring in history from Apple Health, popular
            health-export apps, or a simple spreadsheet.</li>
            <li><strong>Automatic syncing</strong> — On iPhone, connect an
            automated export so your phone sends new readings to NouriLoop on
            its own. On Android, import a compatible file from a supported
            health-export app — automatic syncing is in progress.</li>
    real_life:
        heading: Built for real life
        items: >-
            <li><strong>Smart reminders</strong> — Optional nudges when you
            haven't logged a meal, your health readings are getting stale,
            your calories look off, or your nutrient gaps are widening.</li>
            <li><strong>Notification center</strong> — A bell and inbox
            right in the app gather your goal check-ins and reminders in one
            place, so nothing slips by even if you skip email.</li>
            <li><strong>Email, text, or in-app</strong> — Get notifications
            and goal check-ins however you prefer.</li> <li><strong>Your
            timezone, your day</strong> — "Today" always means <em>your</em>
            local day, wherever you are.</li> <li><strong>GLP-1
            mode</strong> — A dedicated mode for people on GLP-1
            medications, with protein-forward guidance, portion help, and
            awareness of common nausea triggers.</li>
    privacy:
        heading: Private & secure
        items: >-
            <li><strong>Personal, multi-user accounts</strong> — Your data is
            yours, kept separate from other accounts and protected.</li>
            <li><strong>Clear privacy practices</strong> — Plain-language
            notices explain how your health data is handled, including any
            services involved in processing it. See our {health_link}Health
            Data Privacy Notice{link_end}.</li>
    closing: >-
        NouriLoop — close the loop between what you eat and how you feel.
    company: >-
        NouriLoop is built and operated by NouriLoop LLC, an Oregon (USA)
        company. NouriLoop LLC is also the developer of
        <strong>Campaigner</strong>.
