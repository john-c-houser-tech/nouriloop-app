# English source catalog (i18n Phase 1). ICU MessageFormat domain — use ICU
# plural/select syntax for anything countable. Keys are dot-nested by module;
# nested YAML flattens to dotted keys ('settings.language.title').
#
# Sentences with embedded links use ICU placeholders for the markup
# ({terms_link}…{link_end}) rendered with |raw — values are trusted catalog
# text, and this lets a translator reorder the sentence around the link.
