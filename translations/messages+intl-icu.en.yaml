        lead: >-
            Photo-log your meal, and NouriLoop overlays your actual CGM
            readings for the next three hours — so you can finally see which
            foods spike you and which don't. Works with the Abbott Lingo or
            Stelo sensor you already own.
        cta: Try free — works with your Lingo or Stelo
        sensor_note: >-
            <strong>Which sensor, which phone?</strong> Lingo and Stelo both
            work on iPhone. On Android, Stelo works — Lingo doesn't share its
            readings with other apps. Not sure? Start free and ask us; we'll
