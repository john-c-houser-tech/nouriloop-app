            vous montrer (et montrer à votre médecin) la direction que
            vous prenez.</li>
        serious_heading: Conçu pour ceux qui prennent l'avis de leur médecin au sérieux
        serious_body: >-
            NouriLoop a été créé par un développeur dans la soixantaine,
            lassé des apps de nutrition qui ignorent les micronutriments
            ou prétendent à plus de précision qu'une photo ne peut en
            donner. Il vous dit ce qu'il sait, vous dit quand il devine,
            et garde le score sous vos yeux — exactement ce qu'exige un
            vrai suivi d'un conseil médical.
        footnote: >-
            Gratuit pour commencer — vos 10 premières analyses photo de chaque
            mois sont incluses. L'enregistrement photo illimité fait partie de
            Loop ({price} $/mois avec votre propre clé d'IA). Aucune carte
            bancaire requise pour s'inscrire.
    inflammation:
        seo_description: >-
            Un score d'inflammation quotidien calculé depuis ce que vous
            avez vraiment mangé, suivi aux côtés de votre ressenti — pour
            savoir si votre changement d'alimentation fonctionne.
        title: Votre alimentation anti-inflammatoire fonctionne-t-elle ?
        headline: Alimentation anti-inflammatoire ? Vérifiez si elle agit vraiment.
        lead: >-
            Vous avez supprimé les aliments transformés, ajouté le saumon
            et les légumes verts — mais rien ne vous dit si cela aide.
            NouriLoop note chaque journée d'alimentation sur une échelle
            d'inflammation, à partir de ce que vous avez réellement mangé,
            et suit votre ressenti en parallèle. Après quelques semaines,
            la tendance saute aux yeux sur le graphique.
        cta: Découvrez votre score d'inflammation — gratuit
        overview_alt: >-
            La vue d'ensemble Analyses et tendances, menée par la tuile du
            score d'inflammation quotidien
        score_heading: Un score d'inflammation quotidien, depuis des photos de vos repas
        score_items: >-
            <li><strong>Prenez chaque repas en photo</strong> — la
            nutrition est estimée depuis l'image, en quelques secondes.
            Aucune saisie manuelle en base de données.</li>
            <li><strong>Chaque journée reçoit un score de −10 à
            +10 :</strong> graisses saturées, sucre et sodium le poussent
            vers le pro-inflammatoire ; fibres, vitamines antioxydantes,
            poissons gras, huile d'olive, légumes verts et baies le tirent
            dans l'autre sens.</li> <li><strong>Un score transparent, à
            base de règles,</strong> bâti sur la recherche en nutrition
            publiée — la même directionnalité que le Dietary Inflammatory
            Index — pas une boîte noire.</li> <li><strong>Il fonctionne
            rétroactivement :</strong> une journée notée mardi dernier est
            un point de donnée, votre graphique se remplit donc au fil de
            vos enregistrements.</li>
        feel_heading: >-
            Notez votre ressenti. Voyez quels aliments coïncident avec vos
            pires journées.
        feel_intro: >-
            Un curseur quotidien de dix secondes suit ce qui compte pour
            vous — douleurs articulaires, raideurs, digestion, énergie ou
            vos propres symptômes personnalisés. NouriLoop met chacun en
            regard de votre alimentation, jour par jour.
        chart_alt: >-
            Un panneau de relations Tendances empilant un symptôme face
            aux protéines, glucides, lipides, fibres et au score
            d'inflammation
        feel_stats: >-
            Puis il fait les statistiques pour vous — le jour même <em>et</em>
            le lendemain, car les effets de l'alimentation sont souvent
            décalés — et ne fait ressortir que les relations statistiquement
            significatives dans vos données. Pas une intuition. Pas des
            suppositions. Vos propres chiffres, sur plusieurs semaines,
            montrant ce qui évolue ensemble.
        founder: >-
            <strong>Pourquoi NouriLoop existe :</strong> l'app a été créée
            par un développeur dans la soixantaine, atteint d'arthrose,
            qui devait savoir quels aliments déclenchaient ses poussées.
            Il avait fait les changements d'alimentation que tout le monde
            recommande — sans aucun moyen de savoir s'ils agissaient, ni
            quels aliments coïncidaient avec ses pires journées. Alors il
            a construit l'outil qui le pouvait.
        footnote: >-
            Le score d'inflammation et le suivi des symptômes sont des
            fonctionnalités gratuites. Aucune carte bancaire requise pour
            s'inscrire.
    # Page de la campagne B (perte de poids / comptage de calories). Règle
    # d'honnêteté : les objectifs et les bilans programmés sont des fonctions
    # payantes (Loop / Loop+) et sont signalés comme tels — jamais présentés
    # comme gratuits.
    weight_loss:
        seo_description: >-
            Enregistrez vos repas en photo en quelques secondes et recevez
            des estimations de calories honnêtes avec un score de confiance
            — un compteur de calories qui vous dit quand il devine au lieu
            de feindre l'exactitude.
        title: Le compteur de calories qui admet son incertitude
        headline: Le compteur de calories qui admet son incertitude
        lead: >-
            D'autres applis affirment que votre dîner faisait « 423
            calories » — comme si une entrée de base de données pouvait le
            savoir. NouriLoop estime votre repas à partir d'une photo,
            affiche un score de confiance avec chaque estimation et vous
            dit quand vous fier au chiffre et quand l'affiner. Des
            estimations honnêtes sur lesquelles vous pouvez vraiment agir.
        cta: Essayez le comptage honnête des calories — gratuit
        summary_alt: >-
            Le résumé nutritionnel d'un repas enregistré : le score de
            confiance de l'IA, les calories et les macros, puis le panneau
            complet des nutriments
        photo_heading: Prenez une photo. Oubliez la recherche en base de données.
        photo_items: >-
            <li><strong>Enregistrez un repas en quelques
            secondes.</strong> Prenez une photo — les calories, les
            protéines, les glucides et les lipides sont estimés à partir de
            l'image. Fini de chercher « burrito, sauce moyenne » dans une
            base de données.</li> <li><strong>Chaque estimation affiche sa
            confiance.</strong> Un écran de vérification rapide vous permet
            d'ajuster les ingrédients, de répondre à une question de
            clarification ou de joindre l'étiquette nutritionnelle pour un
            chiffre plus précis.</li> <li><strong>Pas de fausse
            précision.</strong> Quand une photo ne permet qu'une estimation
            approximative, NouriLoop le dit — un chiffre fiable vaut mieux
            qu'une supposition à l'air exact.</li>
            <li><strong>La cuisine maison compte aussi.</strong>
            Photographiez une recette — une page de livre de
            cuisine ou une fiche manuscrite — et NouriLoop
            calcule les calories par portion une seule fois.
            Ensuite, consigner ce plat ne prend qu'un
            geste.</li>
        day_heading: Regardez la semaine, pas seulement le repas
        day_alt: >-
            Le tableau de bord NouriLoop : les calories et les protéines du
            jour à côté de vos moyennes récentes
        day_items: >-
            <li><strong>Votre tableau de bord montre où en est la
            journée</strong> — calories et protéines comparées à vos
            propres moyennes récentes, pas à une cible générique.</li>
            <li><strong>Votre poids suit le mouvement :</strong>
            importez-le depuis Apple Health ou votre balance connectée, et
            les Tendances le tracent à côté de ce que vous avez mangé.</li>
            <li><strong>Des tendances sur 7 à 90 jours</strong> — parce
            qu'un dîner gourmand ne compte pas ; le mois, oui.</li>
        goal_heading: Quand vous êtes prêt, fixez un objectif en langage courant
        goal_alt: >-
            La page d'un objectif nutritionnel : la cible, un graphique de
            progression et l'historique des bilans
        goal_body: >-
            Dites à NouriLoop « garde-moi sous 2000 calories par jour »
            dans une courte conversation, et cela devient un objectif
            concret et mesurable. Au rythme que vous choisissez, NouriLoop
            évalue les repas que vous avez réellement enregistrés et vous
            envoie un bilan en langage clair avec un graphique de
            progression — des encouragements quand ça marche, un
            recadrage quand ça ne marche pas.
        goal_tier_note: >-
            La création d'objectifs est gratuite, et chaque compte comprend
            ses {limit} premiers bilans. Loop (${loop_price}/mois, votre
            propre clé d'IA) et Loop+ (${plus_price}/mois, IA incluse) les
            poursuivent chaque jour ou chaque semaine par e-mail ; Loop+ les
            envoie aussi par SMS. Les plans payants commencent par un essai
            gratuit de 7 jours.
        founder: >-
            <strong>Pourquoi NouriLoop existe :</strong> il a été construit
            par un développeur de plus de 60 ans, lassé des compteurs de
            calories qui prétendaient qu'une entrée de base de données
            pouvait être exacte. Il voulait un outil honnête sur ce qu'il
            savait — et qui prévienne quand il devinait. Alors il l'a
            construit.
        footnote: >-
            Gratuit pour commencer — vos 10 premières analyses photo par mois
            et les {limit} premiers bilans de vos objectifs sont inclus. Les
            plans payants commencent à ${price}/mois (Loop, avec votre propre
            clé d'IA) et ajoutent des bilans quotidiens ou hebdomadaires
            illimités ; les bilans par SMS font partie de Loop+. Aucune carte
            bancaire requise pour s'inscrire.

