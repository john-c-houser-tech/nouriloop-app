    health:
        heading: Données de santé
        legend: Bande ombrée = plage quotidienne min–max
        about: >-
            <p class="mt-2 mb-1"><strong>Ce que montre le graphique :</strong>
            vos mesures corporelles importées au fil du temps, avec une bande
            de plage quotidienne. Touchez le bouton d'une métrique pour
            ajouter ou retirer sa ligne.</p> <p class="mb-1"><strong>Source
            des données :</strong> mesures importées via Apple Santé, Health
            Auto Export ou l'API d'ingestion.</p> <p
            class="mb-1"><strong>Comment c'est calculé :</strong> par jour
            local, la ligne = moyenne quotidienne et la bande ombrée =
            min–max quotidien ; aucune transformation au-delà de la
            normalisation d'unités (p. ex. lb→kg). Le badge bon / à
            surveiller / attention sur la tuile de chaque métrique évalue sa
            dernière mesure selon des seuils simples, non médicaux.</p>
    calories:
        heading: Calories quotidiennes
        about: >-
            <p class="mt-2 mb-1"><strong>Ce que montre le graphique :</strong>
            le total de calories enregistrées par jour.</p> <p
            class="mb-1"><strong>Source des données :</strong> les calories
            analysées de vos repas enregistrés.</p> <p
            class="mb-1"><strong>Comment c'est calculé :</strong> somme des
            calories des repas par jour local. Le badge de la vue d'ensemble
            s'allume quand la moyenne quotidienne descend sous 1200 ou
            dépasse 3500 kcal.</p>
    macros:
        heading: Macros moyennes
        about: >-
            <p class="mt-2 mb-1"><strong>Ce que montre le graphique :</strong>
            votre répartition quotidienne moyenne protéines / glucides /
            lipides, en calories.</p> <p class="mb-1"><strong>Source des
            données :</strong> les repas enregistrés sur la période
            sélectionnée.</p> <p class="mb-1"><strong>Comment c'est
            calculé :</strong> moyenne des grammes/jour sur {days, plural,
            one {le dernier jour} other {les # derniers jours}} × 4
            (protéines), 4 (glucides), 9 (lipides) kcal par gramme.</p>
