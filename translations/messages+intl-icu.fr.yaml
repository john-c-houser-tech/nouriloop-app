# French catalog (i18n Phase 1) — first-pass translation of the en source.
# ICU MessageFormat domain — plural categories follow French CLDR rules
# (one covers 0 and 1, other covers the rest). Keys mirror the en catalog
# exactly; product names (Loop, Loop+) and third-party UI terms
# (Health Auto Export, Summarize Data, …) deliberately stay English. The app's
# own name is the {app_name} placeholder (NouriLoop, or a self-hosted copy's name).
