            les heures totales de sommeil par nuit, une ligne facultative de
            délai dîner→sommeil et des points de glucose du soir.</p> <p
            class="mb-1"><strong>Source des données :</strong> données de
            phases de sommeil importées (Core/Deep/REM/inBed), horodatages
            des repas et mesures de glucose.</p> <p
            class="mb-1"><strong>Comment c'est calculé :</strong> heures
            totales = somme des phases de sommeil d'une nuit ; délai = heures
            entre le dîner et l'endormissement ; point de glucose du soir =
            pic en {unit} de 18 h à 22 h. Le tableau ci-dessous associe pour
            chaque nuit le dîner, le glucose du soir (pic 18 h–22 h), le
            délai, le glucose nocturne (moyenne minuit–6 h) et le sommeil,
            avec un code couleur à seuils fixes.</p>
        table_heading: Dîner → Glucose → Sommeil
        table_legend: >-
            Glucose du soir = pic en {unit} de 18 h à 22 h. Glucose nocturne
            = moyenne en {unit} de minuit à 6 h. Code couleur : <span
            class="badge bg-success">bon</span> <span class="badge bg-warning
            text-dark">à surveiller</span> <span class="badge
            bg-danger">élevé</span>
