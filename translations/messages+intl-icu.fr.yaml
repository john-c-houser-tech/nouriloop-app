# ── Public marketing pages (i18n Phase 4): /about, /pricing, /lp/* ──────────
# List-item blobs are trusted HTML fragments rendered with |trans|raw (house
# pattern — see cgm.need_items); embedded links use ICU placeholders
# ({plans_link}…{link_end}) so translators can reorder around the markup.
# Prices are NEVER literal in these messages — templates pass a {price}
# param fed by subscription_price() (the SubscriptionTier single source).
about:
    title: Suivi nutritionnel propulsé par l'IA
    seo_description: >-
        Enregistrez vos repas avec une photo, importez vos recettes, suivez
        votre score d'inflammation, connectez votre CGM et recevez des
        objectifs nutritionnels personnalisés.
    jsonld_description: >-
        Suivi nutritionnel propulsé par l'IA : enregistrement des
        repas par photo, import de recettes, score d'inflammation
        alimentaire, analyses de glucose CGM et objectifs
        nutritionnels personnalisés.
    hero_lead: >-
        NouriLoop transforme de simples photos de vos plats en une image
        claire de votre alimentation — et la relie à votre ressenti.
        Photographiez un repas, et l'IA se charge du plus fastidieux :
        estimer la nutrition, repérer les ingrédients et poser les bonnes
        questions. Au fil du temps, NouriLoop boucle la boucle entre votre
        alimentation, vos données de santé et vos symptômes, pour que vous
        puissiez voir ce qui fonctionne vraiment.
    any_phone: >-
        Fonctionne avec le téléphone que vous avez déjà : iPhone ou Android. NouriLoop
        s'ouvre dans le navigateur de votre téléphone, il n'y a donc rien à installer.
    create_account: Créez votre compte
    sign_in: Se connecter
    plans: Gratuit pour commencer. Envie de plus ? {plans_link}Voir les plans{link_end}.
    disclaimer: >-
        NouriLoop est un outil de bien-être éducatif, pas un dispositif
        médical. Ses scores et analyses sont conçus pour vous aider à
        comprendre les tendances de vos propres données — ils ne
        constituent ni un avis médical ni un diagnostic.
    logging:
        heading: Un journal alimentaire sans effort
        items: >-
            <li><strong>La nutrition en une photo</strong> — Prenez votre
            repas en photo et l'IA de NouriLoop estime calories, protéines,
            glucides, lipides, fibres, sucre et un panel complet de
            vitamines et minéraux.</li> <li><strong>Confirmer et
            affiner</strong> — Chaque estimation passe par un écran de
            relecture rapide où vous pouvez ajuster les ingrédients,
            répondre à une ou deux questions de clarification et peaufiner
            avant d'enregistrer.</li> <li><strong>Portions
            maîtrisées</strong> — Vous en avez mangé la moitié ? Le
            double ? Indiquez le nombre de portions réellement consommées
            et chaque chiffre s'ajuste instantanément.</li>
            <li><strong>Ajoutez une étiquette pour plus de
            précision</strong> — Joignez une seconde photo, comme
            l'étiquette nutritionnelle, et l'IA combine les deux pour une
            estimation plus fine.</li> <li><strong>Enregistrez à votre
            rythme</strong> — Oublié de noter à table ? Antidatez un repas
            au moment où vous l'avez vraiment mangé.</li>
            <li><strong>Favoris</strong> — Enregistrez les repas que vous
            mangez souvent et re-consignez-les en un geste — sans nouvelle
            analyse, sans attente.</li>
            <li><strong>Importez une recette</strong> —
            Photographiez une page de livre de cuisine ou une
            fiche manuscrite : NouriLoop lit les ingrédients et
            le rendement, calcule la nutrition par portion et
            l'enregistre comme favori — en conservant les
            ingrédients et les étapes pour cuisiner plus
            tard.</li>
    nutrition:
        heading: Comprenez votre nutrition
        items: >-
            <li><strong>Tableau de bord quotidien</strong> — Voyez d'un
            coup d'œil vos apports du jour et vos signaux clés.</li>
            <li><strong>Tendances dans la durée</strong> — Des graphiques
            clairs de votre nutrition et de vos données de santé pour
            repérer la direction que vous prenez.</li> <li><strong>Apports
            suffisants et suggestions de compléments</strong> — NouriLoop
            compare votre dernière semaine d'alimentation aux apports
            recommandés et signale là où vous êtes régulièrement en
            dessous.</li> <li><strong>Suivi des compléments</strong> —
            Scannez l'étiquette d'un complément avec votre appareil
            photo : NouriLoop lit le tableau nutritionnel et intègre vos
            compléments quotidiens à son bilan d'adéquation — les
            suggestions tiennent donc compte de ce que vous prenez
            déjà.</li>
    loop:
        heading: 'Bouclez la boucle : alimentation ↔ ressenti'
        items: >-
            <li><strong>Score d'inflammation alimentaire</strong> — Un signal
            quotidien, facile à lire, indiquant à quel point vos choix
            alimentaires ont été pro- ou anti-inflammatoires, fondé sur la
            recherche en nutrition établie.</li> <li><strong>Bilan quotidien
            des symptômes</strong> — Suivez les symptômes qui comptent pour
            vous (douleurs articulaires, digestion, maux de tête, énergie,
            clarté mentale, ou les vôtres) avec un curseur quotidien rapide
            dont l'émoji d'humeur garde la même lecture d'échelle à chaque
            fois.</li> <li><strong>Relations par symptôme</strong> — Chaque
            symptôme a sa propre vue, mise en regard de votre alimentation
            (protéines, glucides, lipides, fibres et score d'inflammation) et
            de vos données corporelles (pas, glucose, poids, sommeil).
            NouriLoop fait tourner les statistiques et ne fait ressortir que
            les relations statistiquement significatives dans vos propres
            données — le jour même et le lendemain, car certains effets sont
            décalés.</li> <li><strong>Prédictions « Et si… »</strong>
            <em>(plans payants)</em> — Curieux de savoir ce que donnerait votre repas
            favori mangé chaque jour pendant deux semaines ? NouriLoop
            projette l'évolution probable de votre score d'inflammation, de
            votre nutrition, de votre poids et de vos symptômes — calculé à
            partir de votre propre historique et expliqué en toute
            simplicité.</li> <li><strong>Analyses de réponse
            glycémique</strong> — Si vous portez un capteur de glucose en
            continu, NouriLoop trace la réponse glycémique de chaque repas, la
            compare à ce que la nutrition du repas laissait prévoir, et classe
            les repas qui vous font le plus et le moins grimper.</li>
            <li><strong>Coach IA des habitudes</strong> <em>(plans payants)</em> — Va
            un cran plus loin : une analyse IA approfondie lit vos propres
            réponses glycémiques d'un repas à l'autre — aliments, horaires et
            combinaisons — et rédige une synthèse de coaching personnalisée,
            pointant les habitudes repérées et quelques ajustements concrets à
            essayer. Entièrement ancrée dans vos données.</li>
    goals:
        heading: Objectifs et coaching personnalisés
        items: >-
            <li><strong>Définition d'objectif par la conversation</strong> —
            Dites à NouriLoop quelque chose comme « je veux manger plus de
            fibres », et un coach IA en fait un objectif concret et mesurable,
            ancré dans vos propres habitudes alimentaires.</li>
            <li><strong>Bilans programmés</strong> — NouriLoop évalue vos
            progrès au rythme que vous choisissez et vous envoie un résumé
            convivial, un graphique ou un rapport, directement dans votre
            boîte de réception.</li> <li><strong>Un coaching à votre
            voix</strong> — Trois curseurs simples règlent la façon dont l'IA
            de NouriLoop s'adresse à vous — du clinique au chaleureux, du très
            sérieux au joueur, du simple à l'expert — pour que vos bilans et
            analyses sonnent comme vous l'aimez.</li> <li><strong>Des cibles
            sûres et réalistes</strong> — Les objectifs sont comparés à des
            limites sûres, et vous êtes averti avant de fixer une cible qui
            pourrait être risquée.</li>
    health:
        heading: Vos données de santé, à votre façon
        items: >-
            <li><strong>Des métriques de santé riches</strong> — Suivez poids, glycémie,
            tension artérielle, fréquence cardiaque, masse grasse, pas et phases de
            sommeil aux côtés de votre nutrition.</li> <li><strong>Des imports
            faciles</strong> — Récupérez votre historique depuis Santé d'Apple, les apps
            d'export de santé populaires ou un simple tableur.</li>
            <li><strong>Synchronisation automatique</strong> — Sur iPhone, connectez une
            exportation automatique pour que votre téléphone envoie les nouvelles
            mesures à NouriLoop tout seul. Sur Android, importez un fichier compatible
            depuis une application d'exportation de santé ; la synchronisation
            automatique est en cours de préparation.</li>
    real_life:
        heading: Pensé pour la vraie vie
        items: >-
            <li><strong>Rappels intelligents</strong> — Des coups de pouce
            optionnels quand vous n'avez pas enregistré de repas, que vos
            mesures de santé datent, que vos calories semblent
            inhabituelles ou que vos manques en nutriments se
            creusent.</li> <li><strong>Centre de notifications</strong> —
            Une cloche et une boîte de réception dans l'app rassemblent
            vos bilans d'objectifs et vos rappels au même endroit, pour
            que rien ne vous échappe même si vous délaissez l'e-mail.</li>
            <li><strong>E-mail, SMS ou dans l'app</strong> — Recevez
            notifications et bilans d'objectifs comme vous préférez.</li>
            <li><strong>Votre fuseau, votre journée</strong> —
            « Aujourd'hui » désigne toujours <em>votre</em> journée
            locale, où que vous soyez.</li> <li><strong>Mode GLP-1</strong>
            — Un mode dédié aux personnes sous médicament GLP-1, avec des
            repères axés protéines, une aide aux portions et une attention
            aux déclencheurs de nausée courants.</li>
    privacy:
        heading: Privé et sécurisé
        items: >-
            <li><strong>Des comptes personnels multi-utilisateurs</strong> —
            Vos données sont à vous, séparées des autres comptes et
            protégées.</li> <li><strong>Des pratiques de confidentialité
            claires</strong> — Des notices en langage simple expliquent
            comment vos données de santé sont traitées, y compris les services
            impliqués dans leur traitement. Consultez notre
            {health_link}Notice de confidentialité des données de
            santé{link_end}.</li>
    closing: >-
        NouriLoop — bouclez la boucle entre ce que vous mangez et comment vous
        vous sentez.
    company: >-
        NouriLoop est conçu et exploité par NouriLoop LLC, société de
        l'Oregon (États-Unis). NouriLoop LLC est aussi le développeur de
        <strong>Campaigner</strong>.
