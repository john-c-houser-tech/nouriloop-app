    inflammation:
        heading: Score d'inflammation alimentaire
        legend: >-
            −10 anti-inflammatoire · 0 neutre · +10 pro-inflammatoire. Une
            estimation éducative à partir des aliments enregistrés — pas un
            avis médical.
        about: >-
            <p class="mt-2 mb-1"><strong>Ce que montre le graphique :</strong>
            une estimation quotidienne de −10 (anti-) à +10
            (pro-inflammatoire) de vos aliments enregistrés — un repère
            bien-être éducatif, pas un avis médical.</p> <p
            class="mb-1"><strong>Source des données :</strong> les repas
            enregistrés chaque jour — leur nutrition analysée et leur liste
            d'ingrédients.</p> <p class="mb-1"><strong>Comment c'est
            calculé :</strong> une heuristique pure (sans IA) combine un
            socle de nutriments (graisses saturées, sucre et sodium poussent
            vers le pro ; fibres + micronutriments antioxydants A/C/D/E, B6,
            folate, B12, Mg, Zn, Se en % des AJR poussent vers l'anti —
            directionnalité selon le Dietary Inflammatory Index) avec des
            ajustements par mots-clés d'aliments (charcuterie / friture /
            sucré → pro ; poisson gras, huile d'olive, légumes-feuilles,
            baies, curcuma → anti, plafonnés par repas), le tout sommé par
            jour local et borné à −10…+10.</p>
        track_symptom: >-
            {link}Suivez un symptôme{link_end} (douleur articulaire,
            ballonnements, mal de tête, énergie…) pour voir comment il évolue
            avec ce score sur la tuile <strong>Symptômes</strong>.
    symptom:
        heading: Relations de {label}
        legend: >-
            Comment <strong>{label}</strong> évolue par rapport à ce que vous
            avez mangé — et, si vous importez des données de santé, à vos
            mesures corporelles. Chaque facteur a son propre mini-graphique
            dans ses unités réelles, empilé sous {label} pour que vous
            puissiez balayer verticalement et voir si un facteur a bougé le
            même jour. Sous chaque graphique, nous listons uniquement les
            facteurs présentant une corrélation <strong>statistiquement
            significative</strong>.
        about: >-
            <p class="mt-2 mb-1"><strong>Ce que montre le graphique :</strong>
            le niveau quotidien de {label} (0–10) empilé au-dessus des autres
            facteurs que vous suivez, chacun dans ses unités. La pile
            <em>Alimentation</em> couvre les protéines, les glucides, les
            lipides, les fibres et votre score d'inflammation alimentaire ;
            la pile <em>Santé</em> couvre les pas, la glycémie, le poids et
            le sommeil nocturne (affichés seulement si vous avez importé ces
            mesures).</p> <p class="mb-1"><strong>Pourquoi empilés plutôt que
            superposés :</strong> ces facteurs utilisent des unités très
            différentes (grammes vs mg/dL vs pas) ; les superposer sur un
            même axe cache les vrais chiffres ou noie la forme dans le
            fouillis. L'empilement garde l'échelle réelle de chaque facteur
            tout en alignant chaque panneau sur le même axe de dates —
            survolez un point pour voir sa valeur exacte.</p> <p
            class="mb-1"><strong>Corrélations significatives :</strong> pour
            chaque facteur nous calculons un <em>r</em> de Pearson le jour
            même et le lendemain (les effets peuvent être décalés), et un
            test de significativité bilatéral. Seules les corrélations avec
            au moins {minDays, plural, one {# jour apparié} other {# jours
            appariés}} et p &lt; 0,05 sont listées — descriptives, pas
            causales, et d'autant plus claires que vous enregistrez.</p>
        diet_heading: Alimentation et {label}
        health_heading: Données de santé et {label}
        diet_corr: Corrélations alimentaires significatives
        health_corr: Corrélations de santé significatives
        corr_line: >-
            <strong>{factor}</strong> {relation} {label} ({lag}, r = {r},
            {n, plural, one {# jour} other {# jours}}).
