supp_suggestion:
    fiber: >-
        Envisagez un complément de fibres (psyllium) ou mangez plus de
        légumineuses, de céréales complètes et de légumes.
    vitaminA: >-
        Envisagez un complément de vitamine A ou consommez davantage de
        foie, de patate douce et de carottes.
    vitaminB1: Envisagez un complexe de vitamines B ou mangez plus de céréales complètes et de légumineuses.
    vitaminB2: >-
        Envisagez un complexe de vitamines B ou mangez plus de produits
        laitiers, d'œufs et de viandes maigres.
    vitaminB3: Envisagez un complexe de vitamines B ou mangez plus de volaille, de poisson et de cacahuètes.
    vitaminB6: >-
        Envisagez un complément de vitamine B6 ou mangez plus de volaille,
        de poisson, de pommes de terre et de bananes.
    vitaminB9: >-
        Envisagez un complément de folate ou un complexe B. Bonnes sources
        alimentaires : légumes-feuilles, haricots.
    vitaminB12: >-
        Envisagez un complément de vitamine B12 (particulièrement important
        pour les alimentations végétales).
    vitaminC: >-
        Envisagez un complément de vitamine C ou mangez plus d'agrumes, de
        poivrons et de brocoli.
    vitaminD: >-
        Envisagez un complément de vitamine D3 — la plupart des gens en
        manquent, surtout en intérieur.
    vitaminE: >-
        Envisagez un complément de vitamine E ou mangez plus de noix, de
        graines et d'huiles végétales.
    vitaminK: >-
        Envisagez un complément de vitamine K2 ou mangez plus de
        légumes-feuilles et d'aliments fermentés.
    calcium: >-
        Envisagez un complément de calcium ou augmentez les produits
        laitiers, les laits végétaux enrichis et les légumes-feuilles.
    iron: >-
        Envisagez un complément de fer — consultez d'abord votre médecin,
        l'excès de fer étant nocif.
    magnesium: >-
        Envisagez un complément de glycinate de magnésium — un manque
        courant, et il favorise le sommeil.
    potassium: "Augmentez les aliments riches en potassium : bananes, avocats, patates douces, haricots."
    zinc: Envisagez un complément de zinc ou mangez plus d'huîtres, de bœuf et de graines de courge.
    selenium: >-
        Deux noix du Brésil par jour couvrent les AJR en sélénium, ou
        envisagez un complément.
