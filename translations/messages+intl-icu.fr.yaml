        ait sa propre courbe de réponse glycémique.
    need_heading: Ce qu'il vous faut
    need_items: >-
        <li>Un capteur <strong>Abbott Lingo</strong> ou <strong>Dexcom
        Stelo</strong> qui affiche déjà des mesures dans l'app
        <strong>Santé</strong> d'Apple sur votre iPhone.</li> <li>Votre
        <strong>iPhone</strong> et environ <strong>10 minutes</strong>.</li>
        <li>Une petite app assistante appelée <strong>Health Auto
        Export</strong> (Étape 1). C'est elle qui fait l'envoi ; sa fonction
        de synchronisation automatique nécessite son propre petit abonnement
        (Basic à 2,99 $, ou 6,99 $ pour un an de Premium).</li>
    need_note: >-
        Avant de commencer : ouvrez l'app Santé et vérifiez que vous y voyez
        des mesures de glucose récentes. Si Santé n'a aucune mesure,
        {app_name} ne peut rien recevoir non plus — vérifiez d'abord l'app de
        votre capteur.
    step1_heading: Installer « Health Auto Export »
    step1_install: >-
        Sur votre iPhone, installez {link}Health Auto Export –
        JSON+CSV{link_end} depuis l'App Store. Vous lisez ceci sur un
        ordinateur ? Pointez l'appareil photo de votre iPhone vers le code QR
        ci-dessous pour y aller directement.
    qr_alt: Code QR App Store
    step1_permissions: >-
        À la première ouverture, elle demande la permission de lire vos
        données Santé. Toucher <strong>Turn On All</strong> (tout activer)
        est le plus simple — mais vous gardez la main : si vous préférez,
        activez seulement ce que vous voulez que {app_name} voie.
        <strong>Blood Glucose</strong> (glycémie) est la donnée dont cette
        configuration a besoin ; <strong>le poids, les pas, le sommeil, la
        fréquence cardiaque et la tension artérielle</strong> sont eux aussi
        bien utilisés dans vos graphiques et tendances.
    permissions_alt: Demande d'accès à Santé avec Blood Glucose activé
    step2_heading: Créez votre jeton d'accès {app_name}
    step2_lead: >-
        Le jeton est comme un mot de passe spécial qui permet à l'app
        assistante — et à elle seule — d'envoyer des données de santé à votre
        compte {app_name}.
    token_reveal: Votre nouveau jeton — vous le collerez à l'Étape 3
    copy: Copier
    copied: Copié
    token_once: >-
        Pour votre sécurité, il ne s'affiche que cette fois-ci — mais pas
        besoin de le mémoriser : l'Étape 3 ci-dessous l'inclut déjà, prêt à
        copier.
    token_again: >-
        Vous avez déjà un jeton, mais pour votre sécurité un jeton ne
        s'affiche qu'une seule fois. Pas de souci — créez-en simplement un
        nouveau et utilisez-le ci-dessous.
    create_token: Créer mon jeton
    step3_heading: Configurez l'automatisation dans Health Auto Export
    step3_lead: >-
        Dans l'app Health Auto Export, ouvrez <strong>Automations</strong> et
        créez une nouvelle automatisation <strong>REST API</strong>.
        Saisissez exactement ces valeurs — utilisez les boutons Copier et
        collez sur votre téléphone (si vous êtes connecté à iCloud des deux
        côtés, copier ici permet souvent de coller là-bas) :
    row_url: URL
    row_method: Méthode
    row_format: Format d'export
    row_header_name: Nom d'en-tête
    row_header_value: Valeur d'en-tête
    bearer_hint: >-
        <code>Bearer</code> + un espace + votre jeton — faites d'abord
        {link}l'Étape 2{link_end} et ce champ se remplit tout seul.
    row_data_type: Type de données
    data_type_body: >-
        <strong>Health Metrics</strong>, puis sous « Select Health Metrics »
        toucher <strong>Select All</strong> est le plus simple — {app_name}
        trace le glucose, le poids, les pas, le sommeil, la fréquence
        cardiaque et la tension artérielle, et ignore simplement tout le
        reste. Vous préférez partager moins ? Sélectionnez seulement
        <strong>Blood Glucose</strong> (la donnée dont cette configuration a
        besoin) plus celles des autres que vous voulez que {app_name} voie.
    row_cadence: Cadence de synchronisation
    cadence_body: >-
        Une fois par <strong>jour</strong> suffit largement — la
        synchronisation de chaque matin apporte les courbes de la veille.
        Vous préférez des courbes le jour même ? Une cadence plus rapide (par
        exemple toutes les heures) convient aussi ; {app_name} ignore les
        mesures qu'il a déjà.
    summarize_warning: >-
        <strong>Un réglage compte plus que tous les autres :</strong> dans
        Export Settings, désactivez <strong>Summarize Data</strong>. Quand il
        est activé, l'app envoie des résumés quotidiens au lieu de vos
        mesures réelles — ils s'importent quand même, mais une journée
        entière se réduit à un seul chiffre, et {app_name} a besoin des
        mesures toutes les ~5 minutes pour tracer vos courbes de repas. Le
        reste peut rester tel quel (Export Format <code>JSON</code>, Export
        Version v2, Date Range Default) ; activer <strong>Batch
        Requests</strong> est une bonne idée — cela découpe une première
        grosse exportation en envois plus petits.
    hae_screen_alt: Health Auto Export — écran {name}
    step4_heading: Envoyez votre première exportation
    step4_body: >-
        Enregistrez l'automatisation, puis lancez-la une fois à la main —
        ouvrez-la et touchez son bouton manuel <strong>export /
        update</strong>. (Après cette première fois, l'app envoie les
        nouvelles mesures selon le calendrier choisi.)
    manual_export_alt: Health Auto Export — déclenchement manuel de l'export
    step5_heading: Regardez les données arriver
    step5_lead: >-
        Cette page vérifie automatiquement l'arrivée de vos données toutes
        les quelques secondes — laissez-la ouverte pendant que vous terminez
        les étapes sur votre téléphone.
    noscript: (JavaScript est désactivé dans ce navigateur — actualisez la page pour mettre à jour.)
    rung_token: Jeton créé
    rung_token_sub: Étape 2 — votre jeton d'accès existe.
    rung_phone: Votre téléphone a contacté {app_name}
    rung_phone_sub: Le jeton a été utilisé récemment — l'automatisation s'est connectée.
    rung_arrived: Des mesures de glucose sont arrivées
    rung_arrived_sub: >-
        {count, plural, one {# mesure} other {# mesures}} au cours des
        {hours} dernières heures
    rung_arrived_tpl: '{count} mesures au cours des {hours} dernières heures'
    rung_latest: "(dernière : {time})"
    rung_quality: Les mesures semblent bonnes
    rung_quality_sub: Mesures fréquentes — assez de détail pour les courbes de repas.
    state_no_token: >-
        Créez votre jeton à {link}l'Étape 2{link_end}, puis configurez
        l'automatisation sur votre téléphone.
    state_token_unused: >-
        Jeton prêt ✓ — dès que vous aurez terminé les Étapes 3 et 4 sur
        votre téléphone, sa première exportation apparaîtra ici.
    state_waiting: >-
        Votre téléphone s'est connecté ✓ — nous attendons maintenant des
        mesures de glucose. Après avoir lancé l'exportation (Étape 4), elles
        apparaissent généralement en moins d'une minute. Si rien n'arrive,
        vérifiez dans l'app Santé que votre capteur enregistre bien des
        mesures de Blood Glucose.
    state_sparse: >-
        <strong>Presque !</strong> Des mesures sont arrivées, mais trop peu
        nombreuses ou trop espacées ({count} sur les deux derniers jours)
        pour des courbes de repas. C'est presque toujours le réglage
        <strong>Summarize Data</strong> : dans les Export Settings de votre
        automatisation, désactivez-le, puis exportez à nouveau.
    state_dense: >-
        <strong>Ça fonctionne !</strong> {count} mesures, espacées d'environ
        {gap} minutes — exactement ce qu'il faut pour les courbes de repas.
    success_heading: Tout est connecté
    success_lead: >-
        Désormais, votre glucose arrive automatiquement selon le calendrier
        choisi dans Health Auto Export. Et maintenant :
    success_chart: '{link}Voyez votre graphique de glucose{link_end} sur la page Données de santé.'
    success_meal: >-
        {link}Enregistrez votre prochain repas{link_end} — avec le glucose
        qui arrive, chaque repas obtient sa courbe de réponse environ 3
        heures après avoir mangé.
    success_insights: >-
        {link}Ouvrez Analyses de glucose{link_end} pour voir quels repas
        font le plus (et le moins) bouger votre glycémie.
    upsell: >-
        <strong>Votre glucose arrive — un plan payant le met au
        travail.</strong> Les plans payants corrèlent chaque repas que vous
        enregistrez avec vos mesures : courbes de réponse par repas,
        classements des plus fortes hausses et des repas les plus doux, et
        plus encore. {link}Voir les plans{link_end}
