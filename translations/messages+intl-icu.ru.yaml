cgm:
    title: Подключите ваш датчик НМГ
    heading: Подключите ваш Lingo или Stelo
    lead: >-
        Однократная настройка, после которой показания глюкозы отправляются в
        {app_name} автоматически — и каждый записанный приём пищи получает
        собственную кривую отклика сахара в крови.
    need_heading: Что понадобится
    need_items: >-
        <li>Сенсор <strong>Abbott Lingo</strong> или <strong>Dexcom
        Stelo</strong>, показания которого уже видны в приложении Apple
        <strong>Здоровье</strong> на вашем iPhone.</li> <li>Ваш
        <strong>iPhone</strong> и около <strong>10 минут</strong>.</li>
        <li>Небольшое вспомогательное приложение <strong>Health Auto
        Export</strong> (Шаг 1). Оно и выполняет отправку; его функция
        автосинхронизации требует собственной небольшой подписки (Basic —
        $2.99, или $6.99 за год Premium).</li>
    need_note: >-
        Прежде чем начать: откройте приложение «Здоровье» и убедитесь, что
        там видны свежие показания глюкозы. Если в «Здоровье» показаний нет,
        {app_name} тоже не сможет их получить — сначала проверьте приложение
        самого сенсора.
    step1_heading: Установите «Health Auto Export»
    step1_install: >-
        На iPhone установите {link}Health Auto Export – JSON+CSV{link_end}
        из App Store. Читаете это на компьютере? Наведите камеру iPhone на
        QR-код ниже, чтобы перейти сразу туда.
    qr_alt: QR-код App Store
    step1_permissions: >-
        При первом запуске приложение попросит доступ к данным «Здоровья».
        Проще всего нажать <strong>Turn On All</strong> — но выбор за вами:
        при желании включите только то, что {app_name} должен видеть.
        <strong>Blood Glucose</strong> (глюкоза) — то, что нужно этой
        настройке; <strong>вес, шаги, сон, пульс и артериальное
        давление</strong> тоже пойдут в дело в ваших графиках и трендах.
    permissions_alt: Запрос доступа к «Здоровью» с включённым Blood Glucose
    step2_heading: Создайте свой токен доступа {app_name}
    step2_lead: >-
        Токен — это как особый пароль, который позволяет вспомогательному
        приложению — и только ему — отправлять данные о здоровье в ваш
        аккаунт {app_name}.
    token_reveal: Ваш новый токен — вы вставите его на Шаге 3
    copy: Копировать
    copied: Скопировано
    token_once: >-
        Ради вашей безопасности он показывается только один раз — но
        запоминать его не нужно: в Шаге 3 ниже он уже подставлен и готов к
        копированию.
    token_again: >-
        У вас уже есть токен, но из соображений безопасности мы показываем
        его только один раз. Ничего страшного — просто создайте новый и
        используйте его ниже.
    create_token: Создать мой токен
    step3_heading: Настройте автоматизацию в Health Auto Export
    step3_lead: >-
        В приложении Health Auto Export откройте <strong>Automations</strong>
        и создайте новую автоматизацию <strong>REST API</strong>. Введите в
        точности эти значения — используйте кнопки «Копировать» и вставляйте
        на телефоне (если на обоих устройствах выполнен вход в iCloud,
        скопированное здесь обычно можно вставить там):
    row_url: URL
    row_method: Метод
    row_format: Формат экспорта
    row_header_name: Имя заголовка
    row_header_value: Значение заголовка
    bearer_hint: >-
        <code>Bearer</code> + пробел + ваш токен — сначала выполните
        {link}Шаг 2{link_end}, и это поле заполнится само.
    row_data_type: Тип данных
    data_type_body: >-
        <strong>Health Metrics</strong>, а затем в «Select Health Metrics»
        проще всего нажать <strong>Select All</strong> — {app_name} строит
        графики по глюкозе, весу, шагам, сну, пульсу и артериальному
        давлению, а остальное просто игнорирует. Хотите делиться меньшим?
        Выберите только <strong>Blood Glucose</strong> (то, что нужно этой
        настройке) плюс любые другие показатели, которые {app_name} должен
        видеть.
    row_cadence: Частота синхронизации
    cadence_body: >-
        Одного раза в <strong>день</strong> вполне достаточно — утренняя
        синхронизация приносит вчерашние кривые. Хотите кривые в тот же
        день? Более частая синхронизация (скажем, раз в час) тоже подойдёт;
        {app_name} игнорирует показания, которые у него уже есть.
    summarize_warning: >-
        <strong>Одна настройка важнее всех остальных:</strong> в Export
        Settings выключите <strong>Summarize Data</strong>. Когда она
        включена, приложение отправляет дневные сводки вместо реальных
        показаний — они тоже импортируются, но целый день схлопывается в
        одно число, а {app_name} нужны показания раз в ~5 минут, чтобы
        рисовать кривые ваших приёмов пищи. Остальное можно оставить как
        есть (Export Format <code>JSON</code>, Export Version v2, Date Range
        Default); включить <strong>Batch Requests</strong> — хорошая идея:
        это разбивает большой первый экспорт на отправки поменьше.
    hae_screen_alt: Health Auto Export — экран {name}
    step4_heading: Отправьте первый экспорт
    step4_body: >-
        Сохраните автоматизацию и запустите её один раз вручную — откройте её
        и нажмите кнопку ручного <strong>export / update</strong>. (После
        этого первого раза приложение будет отправлять новые показания по
        выбранному вами расписанию.)
    manual_export_alt: Health Auto Export — ручной запуск экспорта
    step5_heading: Смотрите, как приходят данные
    step5_lead: >-
        Эта страница сама проверяет ваши данные каждые несколько секунд —
        оставьте её открытой, пока заканчиваете шаги на телефоне.
    noscript: (В этом браузере выключен JavaScript — обновите страницу, чтобы увидеть изменения.)
    rung_token: Токен создан
    rung_token_sub: Шаг 2 — ваш токен доступа существует.
    rung_phone: Ваш телефон связался с {app_name}
    rung_phone_sub: Токен недавно использовался — автоматизация подключилась.
    rung_arrived: Показания глюкозы пришли
    rung_arrived_sub: >-
        {count, plural, one {# показание} few {# показания} many {#
        показаний} other {# показания}} за последние {hours} ч
    rung_arrived_tpl: 'Показаний за последние {hours} ч: {count}'
    rung_latest: '(последнее: {time})'
    rung_quality: Показания выглядят правильно
    rung_quality_sub: Частые показания — достаточно деталей для кривых приёмов пищи.
    state_no_token: >-
        Создайте токен на {link}Шаге 2{link_end}, а затем настройте
        автоматизацию на телефоне.
    state_token_unused: >-
        Токен готов ✓ — когда вы закончите Шаги 3 и 4 на телефоне, его
        первый экспорт появится здесь.
    state_waiting: >-
        Телефон подключился ✓ — теперь ждём показания глюкозы. После запуска
        экспорта (Шаг 4) они обычно появляются в течение минуты. Если ничего
        не приходит, проверьте в приложении «Здоровье», что сенсор
        записывает показания Blood Glucose.
    state_sparse: >-
        <strong>Почти получилось!</strong> Показания пришли, но их слишком
        мало или они слишком редкие ({count} за последние два дня) для
        кривых приёмов пищи. Почти всегда дело в настройке <strong>Summarize
        Data</strong>: в Export Settings вашей автоматизации выключите её и
        экспортируйте снова.
    state_dense: >-
        <strong>Работает!</strong> {count} показаний с интервалом около
        {gap} минут — ровно то, что нужно для кривых приёмов пищи.
    success_heading: Вы подключены
    success_lead: >-
        С этого момента ваша глюкоза поступает автоматически по расписанию,
        которое вы выбрали в Health Auto Export. Что делать дальше:
    success_chart: '{link}Посмотрите график глюкозы{link_end} на странице «Показатели здоровья».'
    success_meal: >-
        {link}Запишите следующий приём пищи{link_end} — теперь, когда
        глюкоза поступает, каждый приём пищи получит свою кривую отклика
        примерно через 3 часа после еды.
    success_insights: >-
        {link}Откройте «Анализ глюкозы»{link_end}, чтобы увидеть, какие
        приёмы пищи сильнее (и слабее) всего двигают ваш сахар.
    upsell: >-
        <strong>Ваша глюкоза уже поступает — платный план заставит её работать
        на вас.</strong> Платные планы сопоставляют каждый записанный приём
        пищи с вашими показаниями: кривые отклика по каждому приёму, рейтинги
        самых резких и самых мягких блюд и многое другое. {link}Смотреть
        планы{link_end}
