            тянут его в провоспалительную сторону; клетчатка,
            витамины-антиоксиданты, жирная рыба, оливковое масло, листовая
            зелень и ягоды — в противоположную.</li> <li><strong>Это
            прозрачная оценка по понятным правилам</strong>, построенная на
            опубликованных исследованиях питания — с той же
            направленностью, что у диетического воспалительного индекса
            (DII), — а не «чёрный ящик».</li> <li><strong>Она работает
            задним числом:</strong> день, оценённый в прошлый вторник, —
            это точка данных, и график заполняется по мере записей.</li>
        feel_heading: >-
            Записывайте самочувствие. Смотрите, какая еда совпадает с
            худшими днями.
        feel_intro: >-
            Десятисекундный ежедневный ползунок отслеживает то, что важно
            вам: боль в суставах, скованность, пищеварение, энергию или
            собственные симптомы. NouriLoop строит график каждого из них
            относительно вашего рациона, день за днём.
        chart_alt: >-
            Панель связей на странице трендов: симптом в сравнении с
            белками, углеводами, жирами, клетчаткой и индексом воспаления
        feel_stats: >-
            Затем он считает статистику за вас — в тот же день <em>и</em> на
            следующий, ведь эффект еды часто запаздывает, — и показывает
            только те связи, которые статистически значимы именно в ваших
            данных. Не догадка. Не интуиция. Ваши собственные числа за недели
            наблюдений, показывающие, что с чем движется.
        founder: >-
            <strong>Зачем существует NouriLoop:</strong> его создал
            разработчик, которому за 60, с остеоартритом — ему нужно было
            понять, какие продукты провоцируют его обострения. Он внёс все
            изменения в рацион, которые обычно советуют, — и не мог узнать,
            работают ли они и какая еда совпадает с худшими днями. Поэтому
            он построил инструмент, который смог это показать.
        footnote: >-
            Индекс воспаления и учёт симптомов — бесплатные функции. Для
            регистрации банковская карта не нужна.
    # Страница кампании B (снижение веса / подсчёт калорий). Правило
    # честности: цели и регулярные отчёты — платные функции (Loop / Loop+),
    # и это указывается явно; они никогда не подаются как бесплатные.
    weight_loss:
        seo_description: >-
            Фотографируйте еду и получайте честные оценки калорий с
            показателем уверенности за секунды — счётчик калорий, который
            говорит, когда он предполагает, вместо того чтобы изображать
            точность.
        title: Счётчик калорий, который признаёт погрешность
        headline: Счётчик калорий, который признаёт погрешность
        lead: >-
            Другие приложения уверяют, что в вашем ужине было «423
            калории» — как будто это можно узнать по записи в базе данных.
            NouriLoop оценивает блюдо по фотографии, показывает к каждой
            оценке показатель уверенности и подсказывает, когда числу
            можно доверять, а когда его стоит уточнить. Честные оценки, на
            которые действительно можно опираться.
        cta: Попробуйте честный подсчёт калорий — бесплатно
        summary_alt: >-
            Сводка питательности записанного приёма пищи: показатель
            уверенности ИИ, калории и макронутриенты, ниже — полная
            таблица нутриентов
        photo_heading: Сфотографируйте. Забудьте о поиске по базе данных.
        photo_items: >-
            <li><strong>Запись за считанные секунды.</strong> Сделайте фото
            — калории, белок, углеводы и жиры оцениваются по изображению.
            Больше не нужно искать в базе «буррито, средняя порция
            сальсы».</li> <li><strong>У каждой оценки виден уровень
            уверенности.</strong> Быстрый экран проверки позволяет
            поправить ингредиенты, ответить на уточняющий вопрос или
            приложить этикетку с пищевой ценностью, чтобы уточнить
            число.</li> <li><strong>Никакой мнимой точности.</strong> Если
            по фотографии возможна лишь приблизительная оценка, NouriLoop
            так и говорит — число, которому можно доверять, ценнее
            догадки с точным видом.</li>
            <li><strong>Домашняя еда тоже считается.</strong>
            Сфотографируйте рецепт — страницу кулинарной книги
            или рукописную карточку — и NouriLoop один раз
            рассчитает калории на порцию. После этого записать
            это блюдо можно одним нажатием.</li>
        day_heading: Смотрите на неделю, а не только на один приём пищи
        day_alt: >-
            Панель NouriLoop: сегодняшние калории и белок рядом с вашими
            недавними средними значениями
        day_items: >-
            <li><strong>Панель показывает, как идёт день</strong> — калории
            и белок в сравнении с вашими собственными недавними средними,
            а не с шаблонной нормой.</li> <li><strong>Вес учитывается
            тоже:</strong> импортируйте его из Apple Health или с умных
            весов, и «Тенденции» построят его график рядом с тем, что вы
            ели.</li> <li><strong>Закономерности за 7–90 дней</strong> —
            один сытный ужин ничего не решает; месяц — решает.</li>
        goal_heading: Когда будете готовы, поставьте цель своими словами
        goal_alt: >-
            Страница цели по питанию: целевой показатель, график прогресса
            и история отчётов
        goal_body: >-
            Скажите NouriLoop в коротком чате «держи меня в пределах 2000
            калорий в день» — и это станет конкретной измеримой целью. С
            выбранной вами периодичностью NouriLoop оценивает реально
            записанные приёмы пищи и присылает понятный отчёт с графиком
            прогресса — поддержку, когда всё получается, и поправку
            курса, когда нет.
        goal_tier_note: >-
            Настройка целей бесплатна, и каждый аккаунт включает первые
            {limit} проверок. Loop (${loop_price}/мес., свой ИИ-ключ) и Loop+
