        heading: 'Связи: {label}'
        legend: >-
            Как <strong>{label}</strong> соотносится с тем, что вы ели, — а
            если вы импортируете данные о здоровье, то и с показателями
            тела. Каждый фактор получает свой мини-график в своих реальных
            единицах, выстроенный под {label}, чтобы можно было просмотреть
            столбец сверху вниз и увидеть, двигался ли фактор в тот же день.
            Под каждым графиком мы перечисляем только факторы со
            <strong>статистически значимой</strong> корреляцией.
        about: >-
            <p class="mt-2 mb-1"><strong>Показывает:</strong> дневной уровень
            «{label}» (0–10) над остальными отслеживаемыми факторами, каждый
            в своих единицах. Стек <em>Питание</em> охватывает белок,
            углеводы, жиры, клетчатку и индекс воспалительности рациона;
            стек <em>Здоровье</em> — шаги, глюкозу крови, вес и ночной сон
            (показывается, только если вы импортировали эти показатели).</p>
            <p class="mb-1"><strong>Почему стек, а не наложение:</strong> у
            этих факторов очень разные единицы (граммы против мг/дл против
            шагов), поэтому наложение на одну ось либо прячет реальные
            числа, либо топит форму кривой в шуме. Стек сохраняет настоящий
            масштаб каждого фактора, выравнивая все панели по одной оси дат
            — наведите на любую точку, чтобы увидеть точное значение.</p> <p
            class="mb-1"><strong>Значимые корреляции:</strong> для каждого
            фактора мы считаем коэффициент Пирсона <em>r</em> в тот же день
            и на следующий день (эффекты могут запаздывать) и двусторонний
