            еженедельно по почте; Loop+ также отправляет их по SMS. Платные
            планы начинаются с бесплатного пробного периода на 7 дней.
        founder: >-
            <strong>Почему существует NouriLoop:</strong> его создал
            разработчик за шестьдесят, уставший от счётчиков калорий,
            которые делали вид, что запись в базе данных может быть
            точной. Ему нужен был инструмент, честный в том, что он знает,
            — и предупреждающий, когда он предполагает. И он его создал.
        footnote: >-
            Начните бесплатно — первые 10 анализов фотографий в месяц и первые
            {limit} проверок ваших целей включены. Платные планы начинаются от
