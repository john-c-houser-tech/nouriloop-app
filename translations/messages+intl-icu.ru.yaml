about:
    title: Учёт питания на основе ИИ
    seo_description: >-
        Записывайте еду по фото, импортируйте рецепты, следите за индексом
        воспаления, подключите НМГ-датчик и получайте персональные цели по
        питанию.
    jsonld_description: >-
        Учёт питания на основе ИИ: запись еды по фото, импорт
        рецептов, индекс воспаления рациона, анализ глюкозы по НМГ и
        персональные цели по питанию.
    hero_lead: >-
        NouriLoop превращает обычные фотографии вашей еды в ясную картину
        того, как вы питаетесь, — и связывает её с тем, как вы себя
        чувствуете. Сфотографируйте блюдо, а ИИ возьмёт на себя самую
        нудную часть: оценит питательность, распознает ингредиенты и задаст
        правильные вопросы. Со временем NouriLoop замыкает круг между вашим
        рационом, показателями здоровья и симптомами — и вы видите, что
        действительно работает.
    any_phone: >-
        Работает на том телефоне, который у вас уже есть, — iPhone или Android.
        NouriLoop открывается в браузере телефона, поэтому ничего устанавливать не
        нужно.
    create_account: Создать аккаунт
    sign_in: Войти
    plans: Начните бесплатно. Хотите больше? {plans_link}Смотрите тарифы{link_end}.
    disclaimer: >-
        NouriLoop — образовательный инструмент для здорового образа жизни,
        а не медицинское устройство. Его оценки и подсказки помогают понять
        закономерности в ваших собственных данных — это не медицинские
        рекомендации и не диагноз.
    logging:
        heading: Запись еды без усилий
        items: >-
            <li><strong>Питательность по одному фото</strong> —
            сфотографируйте блюдо, и ИИ NouriLoop оценит калории, белки,
            углеводы, жиры, клетчатку, сахар и целую панель витаминов и
            минералов.</li> <li><strong>Проверьте и уточните</strong> —
            каждая оценка проходит быстрый экран проверки: скорректируйте
            ингредиенты, ответьте на пару уточняющих вопросов и доведите
            цифры до ума перед сохранением.</li> <li><strong>Учёт
            порций</strong> — съели половину? Съели двойную порцию?
            Укажите, сколько порций было на самом деле, и все цифры
            мгновенно пересчитаются.</li> <li><strong>Этикетка для
            точности</strong> — прикрепите второе фото, например этикетку с
            пищевой ценностью, и ИИ объединит оба снимка для более точной
            оценки.</li> <li><strong>Записывайте, когда удобно</strong> —
            забыли записать за столом? Оформите приём пищи задним числом —
            на то время, когда вы действительно ели.</li>
            <li><strong>Избранное</strong> — сохраняйте блюда, которые
            едите часто, и записывайте их снова в одно касание — без
            повторного анализа и без ожидания.</li>
            <li><strong>Импорт рецепта</strong> —
            Сфотографируйте страницу кулинарной книги или
            рукописную карточку: NouriLoop прочитает ингредиенты
            и выход, рассчитает питательность на порцию и
            сохранит рецепт в избранном — вместе с ингредиентами
            и шагами, чтобы позже по нему готовить.</li>
    nutrition:
        heading: Понимайте своё питание
        items: >-
            <li><strong>Дневная панель</strong> — сегодняшний рацион и
            ключевые сигналы с одного взгляда.</li> <li><strong>Тренды во
            времени</strong> — наглядные графики питания и показателей
            здоровья, чтобы видеть, куда вы движетесь.</li>
            <li><strong>Достаточность нутриентов и предложения
            добавок</strong> — NouriLoop сверяет вашу последнюю неделю
            питания с рекомендуемыми нормами и отмечает, чего вам стабильно
            не хватает.</li> <li><strong>Учёт добавок</strong> —
            отсканируйте этикетку добавки камерой: NouriLoop прочитает
            таблицу состава и включит ваши ежедневные добавки в общую
            картину — чтобы предложения учитывали то, что вы уже
            принимаете.</li>
    loop:
        heading: 'Замкните круг: рацион ↔ самочувствие'
        items: >-
            <li><strong>Индекс воспаления рациона</strong> — ежедневный,
            понятный сигнал о том, насколько про- или противовоспалительной
            была ваша еда, на основе признанных исследований в области
            питания.</li> <li><strong>Ежедневные отметки симптомов</strong> —
            отслеживайте симптомы, которые важны именно вам (боль в суставах,
            пищеварение, головные боли, энергия, ясность мышления или свои
            собственные), с помощью быстрого ежедневного ползунка, чей смайлик
            настроения всегда читается одинаково.</li> <li><strong>Связи по
            каждому симптому</strong> — у каждого симптома своя панель: график
            относительно рациона (белки, углеводы, жиры, клетчатка и индекс
            воспаления) и показателей тела (шаги, глюкоза, вес, сон).
            NouriLoop считает статистику и показывает только статистически
            значимые в ваших данных связи — как в тот же день, так и на
            следующий, ведь некоторые эффекты запаздывают.</li>
            <li><strong>Прогнозы «а что если»</strong> <em>(платные планы)</em> —
            интересно, что будет, если есть любимое блюдо каждый день две
            недели? NouriLoop спрогнозирует, как, вероятно, изменятся ваш
            индекс воспаления, питание, вес и симптомы — по вашей собственной
            истории и простым языком.</li> <li><strong>Отклики
            глюкозы</strong> — если вы носите датчик непрерывного мониторинга
            глюкозы, NouriLoop строит кривую сахара в крови для каждого приёма
            пищи, сравнивает её с прогнозом по питательности блюда и
            показывает, какие блюда поднимали глюкозу сильнее и слабее
            всего.</li> <li><strong>AI Pattern Coach</strong> <em>(платные планы)</em>
            — идёт ещё дальше: ИИ-разбор изучает ваши собственные отклики
            глюкозы по всем приёмам пищи — продукты, время и сочетания за ними
            — и пишет персональное коучинговое резюме: какие закономерности он
            видит и что конкретно стоит попробовать. Полностью на основе ваших
            данных.</li>
    goals:
        heading: Персональные цели и коучинг
        items: >-
            <li><strong>Постановка цели в диалоге</strong> — скажите NouriLoop
            что-нибудь вроде «хочу есть больше клетчатки», и ИИ-коуч превратит
