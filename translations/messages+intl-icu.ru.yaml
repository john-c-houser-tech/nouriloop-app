            Inflammatory Index) с поправками по ключевым словам продуктов
            (переработанное мясо / жареное / сладкое → «про»; жирная рыба,
            оливковое масло, листовая зелень, ягоды, куркума → «анти», с
            ограничением на приём пищи), суммируется по местным дням и
            ограничивается диапазоном −10…+10.</p>
        track_symptom: >-
            {link}Начните отслеживать симптом{link_end} (боль в суставах,
            вздутие, головная боль, энергия…), чтобы увидеть, как он движется
            вместе с этим индексом, на плитке <strong>Симптомы</strong>.
