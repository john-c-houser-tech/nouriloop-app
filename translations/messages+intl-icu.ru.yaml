# Русский каталог (базовый). ICU MessageFormat — во всех счётных сообщениях
# используются полные русские категории CLDR one/few/many/other.
# Название приложения — плейсхолдер {app_name} (NouriLoop или имя
# самостоятельно размещённой копии). Названия тарифов (Free, Loop, Loop+) и термины сторонних
# приложений (Health Auto Export, Summarize Data и т. п.) не переводятся.
