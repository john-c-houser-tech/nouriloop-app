supp_suggestion:
    fiber: >-
        Рассмотрите добавку клетчатки (шелуха подорожника — псиллиум) или
        ешьте больше бобовых, цельных злаков и овощей.
    vitaminA: >-
        Рассмотрите добавку витамина A или ешьте больше печени, батата и
        моркови.
    vitaminB1: >-
        Рассмотрите добавку B-комплекса или ешьте больше цельных злаков и
        бобовых.
    vitaminB2: >-
        Рассмотрите добавку B-комплекса или ешьте больше молочных продуктов,
        яиц и нежирного мяса.
    vitaminB3: >-
        Рассмотрите добавку B-комплекса или ешьте больше птицы, рыбы и
        арахиса.
    vitaminB6: >-
        Рассмотрите добавку витамина B6 или ешьте больше птицы, рыбы,
        картофеля и бананов.
    vitaminB9: >-
        Рассмотрите добавку фолата или B-комплекса. Хорошие источники:
        листовая зелень, фасоль.
    vitaminB12: >-
        Рассмотрите добавку витамина B12 (особенно важно при растительном
        рационе).
    vitaminC: >-
        Рассмотрите добавку витамина C или ешьте больше цитрусовых, сладкого
        перца и брокколи.
    vitaminD: >-
        Рассмотрите добавку витамина D3 — дефицит есть у большинства людей,
        особенно при жизни в помещении.
    vitaminE: >-
        Рассмотрите добавку витамина E или ешьте больше орехов, семян и
        растительных масел.
    vitaminK: >-
        Рассмотрите добавку витамина K2 или ешьте больше листовой зелени и
        ферментированных продуктов.
    calcium: >-
        Рассмотрите добавку кальция или ешьте больше молочных продуктов,
        обогащённого растительного молока и листовой зелени.
    iron: >-
        Рассмотрите добавку железа — сначала проконсультируйтесь с врачом,
        так как избыток железа вреден.
    magnesium: >-
        Рассмотрите добавку глицината магния — его дефицит распространён, а
        магний помогает сну.
    potassium: 'Ешьте больше продуктов, богатых калием: бананы, авокадо, батат, фасоль.'
    zinc: >-
        Рассмотрите добавку цинка или ешьте больше устриц, говядины и
        тыквенных семечек.
    selenium: >-
        Два бразильских ореха в день покрывают РСН селена, или рассмотрите
        добавку.
