# Hindi catalog (i18n Phase 1). Mirrors the en key structure exactly; ICU
# plural categories follow Hindi CLDR (one/other — "one" also covers 0).
# The app's own name is the {app_name} placeholder (NouriLoop, or a self-hosted
# copy's name). Product names (Free/Loop/Loop+) and third-party UI terms the
# user's own phone shows (Health Auto Export, Summarize Data, …) stay English,
# matching the es catalog's conventions.
