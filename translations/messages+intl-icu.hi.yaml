            हर कारक को उसकी असली इकाइयों में अपना मिनी-चार्ट मिलता है, {label}
            के नीचे एक के नीचे एक — ताकि आप सीधे नीचे की ओर देखकर जान सकें कि
            कोई कारक उसी दिन बदला या नहीं। हर चार्ट के नीचे हम केवल वे कारक
            सूचीबद्ध करते हैं जिनका सहसंबंध <strong>सांख्यिकीय रूप से
            महत्वपूर्ण</strong> है।
        about: >-
            <p class="mt-2 mb-1"><strong>दिखाता है:</strong> {label} का दैनिक
            स्तर (0–10), आपके ट्रैक किए बाकी कारकों के ऊपर, हर एक अपनी
            इकाइयों में। <em>आहार</em> स्टैक में प्रोटीन, कार्ब्स, वसा,
            फ़ाइबर और आपका आहार इन्फ़्लेमेशन स्कोर हैं; <em>स्वास्थ्य</em>
            स्टैक में कदम, ब्लड ग्लूकोज़, वज़न और रात की नींद (वे मेट्रिक
            इंपोर्ट किए हों तभी)।</p> <p class="mb-1"><strong>एक-दूसरे पर
            चढ़ाने के बजाय स्टैक क्यों:</strong> इन कारकों की इकाइयाँ बहुत
            अलग हैं (ग्राम बनाम mg/dL बनाम कदम), इसलिए एक ही अक्ष पर चढ़ाने से
            या असली संख्याएँ छिप जाती हैं या आकार गड़बड़ी में दब जाता है।
            स्टैक करने से हर कारक का असली पैमाना बना रहता है और सारे पैनल एक
            ही तारीख़-अक्ष पर सधे रहते हैं — किसी भी बिंदु पर होवर करें, सटीक
            मान दिखेगा।</p> <p class="mb-1"><strong>महत्वपूर्ण
            सहसंबंध:</strong> हर कारक के लिए हम उसी-दिन और अगले-दिन (असर देर
            से भी दिख सकता है) का Pearson <em>r</em> और एक two-tailed
            महत्व-परीक्षण निकालते हैं। केवल वही सहसंबंध सूचीबद्ध होते हैं
            जिनके पास कम से कम {minDays, plural, one {# मेल खाता दिन} other {#
            मेल खाते दिन}} हों और p &lt; 0.05 — ये वर्णनात्मक हैं, कारण नहीं,
            और जितना ज़्यादा दर्ज करेंगे उतने स्पष्ट होंगे।</p>
