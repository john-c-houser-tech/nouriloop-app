supp_suggestion:
    fiber: >-
        फ़ाइबर सप्लीमेंट (इसबगोल/साइलियम हस्क) पर विचार करें, या दालें-फलियाँ,
        साबुत अनाज और सब्ज़ियाँ अधिक खाएँ।
    vitaminA: >-
        विटामिन A सप्लीमेंट पर विचार करें, या कलेजी, शकरकंद और गाजर अधिक लें।
    vitaminB1: B-कॉम्प्लेक्स सप्लीमेंट पर विचार करें, या साबुत अनाज और दालें अधिक खाएँ।
    vitaminB2: B-कॉम्प्लेक्स सप्लीमेंट पर विचार करें, या डेयरी, अंडे और लीन मीट अधिक खाएँ।
    vitaminB3: B-कॉम्प्लेक्स सप्लीमेंट पर विचार करें, या चिकन, मछली और मूँगफली अधिक खाएँ।
    vitaminB6: >-
        विटामिन B6 सप्लीमेंट पर विचार करें, या चिकन, मछली, आलू और केले अधिक
        खाएँ।
    vitaminB9: >-
        फ़ोलेट या B-कॉम्प्लेक्स सप्लीमेंट पर विचार करें। अच्छे स्रोत: हरी
        पत्तेदार सब्ज़ियाँ, बीन्स।
    vitaminB12: विटामिन B12 सप्लीमेंट पर विचार करें (शाकाहारी आहार में विशेष रूप से ज़रूरी)।
    vitaminC: >-
        विटामिन C सप्लीमेंट पर विचार करें, या खट्टे फल, शिमला मिर्च और
        ब्रोकली अधिक खाएँ।
    vitaminD: >-
        विटामिन D3 सप्लीमेंट पर विचार करें — ज़्यादातर लोगों में इसकी कमी होती
        है, ख़ासकर घर के भीतर रहने पर।
    vitaminE: विटामिन E सप्लीमेंट पर विचार करें, या मेवे, बीज और वनस्पति तेल अधिक लें।
    vitaminK: >-
        विटामिन K2 सप्लीमेंट पर विचार करें, या हरी पत्तेदार सब्ज़ियाँ और
        फ़र्मेंटेड खाद्य अधिक खाएँ।
    calcium: >-
        कैल्शियम सप्लीमेंट पर विचार करें, या डेयरी, फ़ोर्टिफ़ाइड प्लांट मिल्क
        और हरी पत्तेदार सब्ज़ियाँ बढ़ाएँ।
    iron: >-
        आयरन सप्लीमेंट पर विचार करें — पहले अपने डॉक्टर से पूछें, क्योंकि
        ज़रूरत से ज़्यादा आयरन हानिकारक है।
    magnesium: >-
        मैग्नीशियम ग्लाइसिनेट सप्लीमेंट पर विचार करें — इसकी कमी आम है और यह
        नींद में मदद करता है।
    potassium: 'पोटैशियम-भरपूर खाद्य बढ़ाएँ: केले, एवोकाडो, शकरकंद, बीन्स।'
    zinc: ज़िंक सप्लीमेंट पर विचार करें, या सीप (ऑयस्टर), बीफ़ और कद्दू के बीज अधिक खाएँ।
    selenium: >-
        रोज़ दो ब्राज़ील नट्स सेलेनियम की RDA पूरी कर देते हैं, या सप्लीमेंट
        पर विचार करें।
