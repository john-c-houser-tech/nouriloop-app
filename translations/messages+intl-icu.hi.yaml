    sign_in: साइन इन करें
    plans: शुरुआत मुफ़्त है। और चाहिए? {plans_link}प्लान देखें{link_end}।
    disclaimer: >-
        NouriLoop एक शैक्षिक वेलनेस टूल है, चिकित्सा उपकरण नहीं। इसके स्कोर
        और विश्लेषण आपके अपने डेटा के पैटर्न समझने में मदद के लिए बनाए गए
        हैं — ये चिकित्सा सलाह या निदान नहीं हैं।
    logging:
        heading: भोजन दर्ज करना हुआ आसान
        items: >-
            <li><strong>फ़ोटो खींचिए, पोषण पाइए</strong> — अपने भोजन की एक
            तस्वीर लें और NouriLoop का AI कैलोरी, प्रोटीन, कार्ब्स, वसा,
            फ़ाइबर, शुगर और विटामिन-मिनरल के पूरे पैनल का अनुमान लगा देता
            है।</li> <li><strong>पुष्टि और सुधार</strong> — हर अनुमान के लिए
            एक झटपट समीक्षा स्क्रीन, जहाँ आप सामग्री बदल सकते हैं, एक-दो
            स्पष्ट करने वाले सवालों के जवाब दे सकते हैं और सहेजने से पहले
            बारीक़ी से सुधार सकते हैं।</li> <li><strong>हिस्से पर
            नियंत्रण</strong> — आधा खाया? दोगुना खाया? बताइए कि असल में
            कितनी सर्विंग खाईं, और हर आँकड़ा तुरंत उसी हिसाब से बदल जाता
            है।</li> <li><strong>सटीकता के लिए लेबल जोड़ें</strong> — दूसरी
            फ़ोटो जोड़ें, जैसे न्यूट्रिशन-फ़ैक्ट्स लेबल, और AI दोनों को
            मिलाकर और सटीक अनुमान देता है।</li> <li><strong>अपनी सुविधा से
            दर्ज करें</strong> — खाते समय दर्ज करना रह गया? भोजन को उसी समय
            पर बैकडेट कर दें, जब आपने उसे असल में खाया था।</li>
            <li><strong>पसंदीदा</strong> — अक्सर खाए जाने वाले भोजन सहेज लें
            और एक टैप में दोबारा दर्ज करें — न दोबारा विश्लेषण, न
            इंतज़ार।</li>
            <li><strong>रेसिपी इंपोर्ट करें</strong> — कुकबुक का
            पन्ना या हाथ से लिखा कार्ड फ़ोटो करें: NouriLoop
            सामग्री और सर्विंग की संख्या पढ़ता है, प्रति सर्विंग
            पोषण निकालता है और उसे फ़ेवरिट के रूप में सहेजता है
            — सामग्री और विधि के साथ, ताकि आप बाद में उससे बना
            सकें।</li>
    nutrition:
        heading: अपने पोषण को समझें
        items: >-
            <li><strong>दैनिक डैशबोर्ड</strong> — आज का सेवन और मुख्य संकेत
            एक नज़र में देखें।</li> <li><strong>समय के साथ रुझान</strong> —
            आपके पोषण और स्वास्थ्य डेटा के विज़ुअल चार्ट, ताकि साफ़ दिखे कि
            आप किस दिशा में बढ़ रहे हैं।</li> <li><strong>पोषक तत्वों की
            पर्याप्तता और सप्लीमेंट सुझाव</strong> — NouriLoop आपके पिछले
            हफ़्ते के खान-पान की तुलना अनुशंसित मात्राओं से करता है और बताता
            है कि आप कहाँ लगातार पीछे रह रहे हैं।</li>
            <li><strong>सप्लीमेंट ट्रैकिंग</strong> — कैमरे से सप्लीमेंट का
            लेबल स्कैन करें: NouriLoop फ़ैक्ट्स पैनल पढ़कर आपके दैनिक
            सप्लीमेंट को पर्याप्तता की तस्वीर में शामिल कर लेता है — ताकि
            सुझाव उसी को ध्यान में रखें, जो आप पहले से ले रहे हैं।</li>
    loop:
        heading: 'लूप पूरा करें: आहार ↔ आपका एहसास'
        items: >-
            <li><strong>आहार का इन्फ़्लेमेशन स्कोर</strong> — एक दैनिक, आसानी
            से समझ आने वाला संकेत कि आपके भोजन के चुनाव कितने प्रो- या
            एंटी-इन्फ़्लेमेटरी रहे, स्थापित पोषण अनुसंधान पर आधारित।</li>
            <li><strong>लक्षण चेक-इन</strong> — जो लक्षण आपके लिए मायने रखते
            हैं (जोड़ों का दर्द, पाचन, सिरदर्द, ऊर्जा, मानसिक स्पष्टता या आपके
            अपने कस्टम लक्षण) उन्हें रोज़ एक झटपट स्लाइडर से ट्रैक करें, जिसका
            मूड-चेहरा पैमाने का मतलब हर बार एक जैसा रखता है।</li>
            <li><strong>हर लक्षण के अपने संबंध</strong> — हर लक्षण को अपना अलग
            व्यू मिलता है, जो उसे आपके आहार (प्रोटीन, कार्ब्स, वसा, फ़ाइबर और
            आपके इन्फ़्लेमेशन स्कोर) और शरीर के मेट्रिक (कदम, ग्लूकोज़, वज़न,
            नींद) के सामने चार्ट करता है। आँकड़ों की गणना NouriLoop करता है और
            सिर्फ़ वही संबंध दिखाता है, जो आपके अपने डेटा में सांख्यिकीय रूप
            से सार्थक हों — उसी दिन के भी और अगले दिन के भी, क्योंकि कुछ असर
            देर से दिखते हैं।</li> <li><strong>"क्या होगा अगर" अनुमान</strong>
            <em>(सशुल्क प्लान)</em> — सोच रहे हैं कि दो हफ़्ते रोज़ अपना पसंदीदा भोजन
            खाने से क्या होगा? NouriLoop अनुमान लगाता है कि आपका इन्फ़्लेमेशन
            स्कोर, पोषण, वज़न और लक्षण किस दिशा में जा सकते हैं — आपके अपने
            इतिहास से गणना करके, सरल भाषा में समझाया हुआ।</li>
            <li><strong>ग्लूकोज़ रिस्पॉन्स विश्लेषण</strong> — अगर आप
            कंटीन्युअस ग्लूकोज़ मॉनिटर पहनते हैं, तो NouriLoop हर भोजन का
            ब्लड-शुगर रिस्पॉन्स मैप करता है, उसकी तुलना भोजन के पोषण-आधारित
            अनुमान से करता है, और रैंक करता है कि किन भोजनों ने आपको सबसे
            ज़्यादा और सबसे कम उछाला।</li> <li><strong>AI पैटर्न कोच</strong>
            <em>(सशुल्क प्लान)</em> — एक क़दम और आगे: एक AI डीप-डाइव आपके ही ग्लूकोज़
            रिस्पॉन्स को भोजनों के आर-पार पढ़ता है — उनके पीछे के खाद्य, समय
            और संयोजन — और एक व्यक्तिगत कोचिंग सारांश लिखता है: कौन-से पैटर्न
            दिखे और आज़माने लायक़ कुछ ठोस बदलाव। पूरी तरह आपके अपने डेटा पर
            आधारित।</li>
    goals:
        heading: व्यक्तिगत लक्ष्य और कोचिंग
        items: >-
            <li><strong>बातचीत से लक्ष्य सेटअप</strong> — NouriLoop से बस इतना
            कहें, "मुझे ज़्यादा फ़ाइबर खाना है", और AI कोच उसे आपकी अपनी
            खान-पान की आदतों पर आधारित एक ठोस, मापने योग्य लक्ष्य में बदल देता
            है।</li> <li><strong>निर्धारित चेक-इन</strong> — आपकी चुनी हुई
            समय-सारिणी पर NouriLoop आपकी प्रगति आँकता है और एक दोस्ताना
            सारांश, चार्ट या रिपोर्ट सीधे आपके इनबॉक्स में भेजता है।</li>
            <li><strong>आपकी पसंद की आवाज़ में कोचिंग</strong> — तीन आसान
            स्लाइडर तय करते हैं कि NouriLoop का AI आपसे कैसे बात करे —
            क्लिनिकल से गर्मजोशी तक, औपचारिक से मज़ाक़िया तक, सीधा-सरल से
            विशेषज्ञ स्तर तक — ताकि आपके चेक-इन और विश्लेषण वैसे ही सुनाई दें,
            जैसे आपको पसंद हैं।</li> <li><strong>सुरक्षित, व्यावहारिक
            लक्ष्य</strong> — हर लक्ष्य को सुरक्षित सीमाओं से मिलाकर जाँचा
            जाता है, और असुरक्षित हो सकने वाला लक्ष्य तय करने से पहले आपको
            चेतावनी दी जाती है।</li>
    health:
        heading: आपका स्वास्थ्य डेटा, आपके तरीक़े से
        items: >-
            <li><strong>भरपूर स्वास्थ्य मेट्रिक</strong> — वज़न, ब्लड ग्लूकोज़, रक्तचाप,
            हृदय गति, बॉडी फ़ैट, कदम और नींद के चरण — सब अपने पोषण के साथ-साथ ट्रैक
            करें।</li> <li><strong>आसान इंपोर्ट</strong> — Apple Health, लोकप्रिय
            हेल्थ-एक्सपोर्ट ऐप्स या एक साधारण स्प्रेडशीट से अपना इतिहास ले आएँ।</li>
            <li><strong>अपने आप सिंक</strong> — iPhone पर एक अपने आप चलने वाला एक्सपोर्ट
            जोड़ें ताकि आपका फ़ोन नई रीडिंग खुद NouriLoop को भेजता रहे। Android पर किसी
            हेल्थ-एक्सपोर्ट ऐप से एक संगत फ़ाइल इम्पोर्ट करें; अपने आप सिंक होने की
            सुविधा पर काम चल रहा है।</li>
    real_life:
        heading: असल ज़िंदगी के लिए बना
        items: >-
            <li><strong>समझदार रिमाइंडर</strong> — चाहें तो हल्की-सी याद
            दिलाहट, जब आपने भोजन दर्ज न किया हो, आपकी स्वास्थ्य रीडिंग
            पुरानी पड़ रही हों, आपकी कैलोरी असामान्य दिख रही हों या पोषक
            तत्वों की कमी बढ़ रही हो।</li> <li><strong>सूचना केंद्र</strong>
            — ऐप के भीतर ही एक घंटी और इनबॉक्स आपके लक्ष्य चेक-इन और
            रिमाइंडर एक जगह समेट देते हैं, ताकि ईमेल छूट भी जाए तो कुछ
            छूटे नहीं।</li> <li><strong>ईमेल, टेक्स्ट या ऐप में</strong> —
            सूचनाएँ और लक्ष्य चेक-इन उसी माध्यम से पाएँ, जो आपको पसंद
            हो।</li> <li><strong>आपका समय क्षेत्र, आपका दिन</strong> —
            “आज” का मतलब हमेशा <em>आपका</em> स्थानीय दिन होता है, आप दुनिया
            में कहीं भी हों।</li> <li><strong>GLP-1 मोड</strong> — GLP-1
            दवाएँ लेने वालों के लिए एक समर्पित मोड: प्रोटीन-फ़ोकस
            मार्गदर्शन, हिस्से में मदद और आम मितली-ट्रिगर की समझ।</li>
    privacy:
        heading: निजी और सुरक्षित
        items: >-
            <li><strong>निजी, मल्टी-यूज़र खाते</strong> — आपका डेटा सिर्फ़
            आपका है — दूसरे खातों से अलग और संरक्षित रखा जाता है।</li>
            <li><strong>साफ़ गोपनीयता नीतियाँ</strong> — सरल भाषा की सूचनाएँ
            बताती हैं कि आपका स्वास्थ्य डेटा कैसे सँभाला जाता है, और उसकी
            प्रोसेसिंग में कौन-सी सेवाएँ शामिल हैं। देखें हमारी
            {health_link}स्वास्थ्य डेटा गोपनीयता सूचना{link_end}।</li>
    closing: >-
        NouriLoop — जो आप खाते हैं और जैसा महसूस करते हैं, उनके बीच का लूप
        पूरा करें।
    company: >-
        NouriLoop को NouriLoop LLC बनाती और चलाती है — एक Oregon (USA)
        कंपनी। NouriLoop LLC ही <strong>Campaigner</strong> की भी डेवलपर
        है।
