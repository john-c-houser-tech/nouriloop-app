framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Mail and SMS are intentionally left unrouted, so they are handled
            # synchronously in-process — no "messenger:consume" worker is required
            # (this suits shared hosting and the nightly notifications cron). Route
            # them to "async" and run a worker if you ever need to offload them.
            # (The Flex recipe's ChatMessage → async route was removed 2026-09-30:
            # nothing sends chat messages, and with no worker running anywhere, one
            # would have queued forever instead of sending.)

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
