twig:
    file_name_pattern: '*.twig'
    globals:
        # google_analytics_id and meta_pixel_id come from App\Twig\AnalyticsGlobalsExtension:
        # the GOOGLE_ANALYTICS_ID / META_PIXEL_ID env values (empty in dev/test/CI), but only
        # on NouriLoop's own service — a self-hosted copy never loads NouriLoop's trackers.
        # base.html.twig still restricts *where* the pixel loads even when it is set.
        # Release version in the footer. Empty in dev/test/CI (see APP_VERSION in
        # .env) → no version shown; stamped per-deploy from `git describe`.
        app_version: '%env(APP_VERSION)%'
        # This instance's public address (DEFAULT_URI): what the CGM wizard tells users to
        # paste into Health Auto Export. https://app.nouriloop.com on the hosted service.
        public_base_url: '%env(DEFAULT_URI)%'
        # Hosted service or self-hosted copy (APP_HOSTING_MODE): `hosting.hosted` hides
        # pricing links on public pages of a self-hosted copy, where /pricing is a 404.
        hosting: '@App\Hosting\HostingMode'
        # This instance's name, logo, legal links and source link (configurable branding):
        # brand.name, brand.logoUrl, brand.isNouriLoop, brand.sourceUrl …
        brand: '@App\Hosting\Brand'

when@test:
    twig:
        strict_variables: true
