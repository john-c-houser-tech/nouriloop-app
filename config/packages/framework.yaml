# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Cookie hardening is set explicitly (these match Symfony's defaults, but we
    # pin them so the security posture is auditable): HTTPS-only in prod, not
    # readable from JS, and not sent on cross-site requests.
    session:
        # App-specific cookie name: browser cookies ignore ports, so on localhost
        # the default PHPSESSID was shared with Campaigner's dev server (:8010),
        # whose in-memory user 500'd our Doctrine provider (see CLAUDE.md, Auth).
        name: NOURILOOP_SESSID
        cookie_secure: auto      # secure flag whenever the request is HTTPS (prod)
        cookie_samesite: lax
        cookie_httponly: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
