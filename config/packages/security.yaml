security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # Same disabled-account check as the web firewall, so revoking a user
            # (is_active = 0) also cuts off their bearer-token API access.
            user_checker: App\Security\UserChecker
            access_token:
                token_handler: App\Security\ApiTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            # Passwordless "email me a sign-in link" (magic links, LoginLinkController).
            # check_post_only: the emailed URL renders a confirm page on GET and only
            # the page's button POST authenticates — so email-client link scanners
            # that prefetch GETs can't consume the single-use link. Including
            # `password` in signature_properties invalidates outstanding links when
            # the password changes (e.g. via a reset).
            login_link:
                check_route: app_login_check_link
                check_post_only: true
                signature_properties: ['id', 'password']
                lifetime: 900 # 15 minutes
                max_uses: 1 # single-use, tracked in an auto-provisioned cache pool
                default_target_path: app_dashboard
            # Throttle repeated failed logins (per username + IP) to blunt brute force.
            login_throttling:
                max_attempts: 5
            logout:
                path: app_logout
                target: app_login
            # Long-lived, always-on sessions: the audience skews older and re-typing
            # passwords is the #1 login friction. 180 days (not a year) so a stolen
            # cookie ages out; logout still clears it immediately.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 15552000 # 180 days
                always_remember_me: true

    access_control:
        # Locale-prefixed twins of the public conversion pages (i18n Phase 4,
        # /es/about … — prefix list mirrors SupportedLocale::URL_PREFIX_REQUIREMENT).
        # Must be listed: the bare-path rules below don't match /es/login etc.,
        # and the catch-all would bounce anonymous visitors to the login page.
        - { path: '^/(en-gb|es|es-mx|es-es|de|fr|ru|hi)/(login|register|about|pricing|lp)(/|$)', roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Public so a logged-out GET /logout can't be access-denied — the denial
        # would save /logout as the session's post-login target path, and the next
        # successful sign-in (form or link) would redirect through it and instantly
        # log the user back out. The logout listener itself no-ops without a token.
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/privacy, roles: PUBLIC_ACCESS }
        - { path: ^/about, roles: PUBLIC_ACCESS }
        - { path: ^/help, roles: PUBLIC_ACCESS }
        - { path: ^/pricing, roles: PUBLIC_ACCESS }
        # Ad-specific landing pages (Marketing Plan §8) — public, noindex'd.
        - { path: ^/lp, roles: PUBLIC_ACCESS }
        # Public "Send us feedback" form (linked from the footer on every page).
        - { path: ^/feedback, roles: PUBLIC_ACCESS }
        # SEO crawl files (served by controllers, so they pass through the firewall).
        - { path: '^/(robots\.txt|sitemap\.xml)$', roles: PUBLIC_ACCESS }
        # RFC 9116 security.txt — the vulnerability-reporting contact. MUST stay
        # anonymous: its entire purpose is being readable by someone outside, and this
        # is the only published disclosure path (SECURITY.md is in a private repo).
        # Bouncing it to /login would be indistinguishable from not having one.
        - { path: '^/\.well-known/security\.txt$', roles: PUBLIC_ACCESS }
        # Return target from a cancelled Stripe Checkout (no auth needed to bounce back).
        - { path: ^/subscription/cancel-checkout, roles: PUBLIC_ACCESS }
        # Machine-to-machine Stripe webhook (verified by signature, not session/CSRF).
        - { path: ^/webhook/stripe, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Aggregate business metrics (registrations by campaign) for the operator's
        # own tooling — whole-account figures, so an ordinary user's bearer token
        # must not reach them. Must precede the ^/api rule (first match wins).
        - { path: ^/api/metrics, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
